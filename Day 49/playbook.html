<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Playbook — Solo Dev Edition</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:#0f1115;
  --panel:#161a21;
  --panel-2:#1d222b;
  --panel-3:#242a35;
  --line: #2a3140;
  --line-soft:#20262f;
  --text:#e8eaee;
  --text-dim:#9aa3b2;
  --text-faint:#606a7a;
  --signal:#5ee6c8;
  --signal-dim:#3aa895;
  --amber:#ffb454;
  --coral:#ff7a68;
  --violet:#a78bfa;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 10px 40px -12px rgba(0,0,0,0.5);
  --transition: 180ms cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --ink:#f6f5f1;
  --panel:#ffffff;
  --panel-2:#fbfaf7;
  --panel-3:#f1efe9;
  --line:#e2ded4;
  --line-soft:#ebe8e0;
  --text:#1c1d1f;
  --text-dim:#5c5d61;
  --text-faint:#94969c;
  --signal:#0f9e82;
  --signal-dim:#0c8069;
  --amber:#b3720a;
  --coral:#c04a3a;
  --violet:#6d4fd4;
  --shadow: 0 10px 30px -14px rgba(20,20,15,0.18);
}

@font-face{ font-family:'Fraunces'; src:local('Georgia'); }
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background var(--transition), color var(--transition);
}
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-0.01em; }
code, .mono{ font-family:var(--font-mono); }
::selection{ background:var(--signal); color:#08110f; }
button{ font-family:inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--signal); outline-offset:2px; border-radius:4px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.shell{ display:flex; min-height:100vh; }

/* ---------- Sidebar ---------- */
.sidebar{
  width:248px; flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line-soft);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:40;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:22px 20px 18px 20px;
  border-bottom:1px solid var(--line-soft);
}
.brand-mark{
  width:30px; height:30px; border-radius:8px;
  background:linear-gradient(135deg, var(--signal), var(--violet));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:14px; color:#0a0f0d;
  flex-shrink:0;
}
.brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.brand-text strong{ font-family:var(--font-display); font-size:16px; font-weight:600; }
.brand-text span{ font-size:11px; color:var(--text-faint); font-family:var(--font-mono); }

.nav{ padding:14px 12px; display:flex; flex-direction:column; gap:2px; flex:1; }
.nav-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); padding:14px 10px 6px; font-weight:600; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  color:var(--text-dim); font-size:13.5px; font-weight:500;
  border:1px solid transparent; background:none; text-align:left; width:100%;
  transition:background var(--transition), color var(--transition);
}
.nav-item:hover{ background:var(--panel-2); color:var(--text); }
.nav-item.active{ background:var(--panel-3); color:var(--text); border-color:var(--line); }
.nav-item.active .nav-ico{ color:var(--signal); }
.nav-ico{ width:16px; height:16px; flex-shrink:0; color:var(--text-faint); }
.nav-count{ margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); background:var(--panel-3); padding:1px 6px; border-radius:20px; }

.sidebar-foot{ padding:14px 16px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:8px; }
.foot-btn{
  display:flex; align-items:center; gap:8px; width:100%;
  padding:8px 10px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel-2); color:var(--text-dim); font-size:12.5px; cursor:pointer;
}
.foot-btn:hover{ color:var(--text); border-color:var(--text-faint); }
.foot-row{ display:flex; gap:8px; }
.foot-row .foot-btn{ flex:1; justify-content:center; }

/* ---------- Main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding:14px 28px; background:rgba(15,17,21,0.85);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line-soft);
}
[data-theme="light"] .topbar{ background:rgba(246,245,241,0.85); }
.hamburger{ display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:7px; color:var(--text); cursor:pointer; }
.search-wrap{ position:relative; flex:1; max-width:420px; }
.search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint); }
.search-input{
  width:100%; padding:9px 12px 9px 34px; border-radius:9px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  font-size:13.5px;
}
.search-input::placeholder{ color:var(--text-faint); }
.kbd-hint{ position:absolute; right:9px; top:50%; transform:translateY(-50%); font-family:var(--font-mono); font-size:10px; color:var(--text-faint); border:1px solid var(--line); padding:2px 5px; border-radius:4px; }
.topbar-spacer{ flex:1; }
.icon-btn{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2);
  color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:all var(--transition);
}
.icon-btn:hover{ color:var(--text); border-color:var(--text-faint); }
.icon-btn svg{ width:16px; height:16px; }

.content{ flex:1; padding:26px 28px 60px; max-width:1180px; width:100%; margin:0 auto; }

.page-head{ margin-bottom:22px; }
.page-eyebrow{ font-family:var(--font-mono); font-size:11px; color:var(--signal); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; }
.page-title{ font-size:28px; margin-bottom:6px; }
.page-sub{ color:var(--text-dim); font-size:14px; max-width:640px; }

/* ============================================================
   EXPLAINER BANNER (persistent, dismissible)
   ============================================================ */
.explainer{
  background:linear-gradient(135deg, var(--panel-2), var(--panel-3));
  border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:24px; display:flex; gap:14px; align-items:flex-start;
  position:relative;
}
.explainer-ico{ width:34px; height:34px; border-radius:9px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--signal); }
.explainer-ico svg{ width:18px; height:18px; }
.explainer h3{ font-size:15px; margin-bottom:5px; }
.explainer p{ margin:0; color:var(--text-dim); font-size:13px; line-height:1.55; max-width:720px; }
.explainer p + p{ margin-top:6px; }
.explainer-close{
  position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:7px;
  border:1px solid var(--line); background:var(--panel); color:var(--text-faint); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.explainer-close:hover{ color:var(--text); }
.explainer-map{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; }
.explainer-map span{ font-size:12px; color:var(--text-dim); }
.explainer-map b{ color:var(--text); font-weight:600; }

/* ============================================================
   STATS ROW
   ============================================================ */
.stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
.stat-card{ background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:16px 18px; }
.stat-num{ font-family:var(--font-display); font-size:26px; font-weight:600; }
.stat-label{ font-size:12px; color:var(--text-faint); margin-top:2px; }

/* ============================================================
   CATEGORY GRID / CARDS
   ============================================================ */
.section-block{ margin-bottom:34px; }
.section-block-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
.section-block-head h2{ font-size:18px; display:flex; align-items:center; gap:9px; }
.section-block-head p{ margin:2px 0 0; font-size:12.5px; color:var(--text-faint); }
.cat-chip{ font-family:var(--font-mono); font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid; }

.workflow-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }

.wf-card{
  background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:16px 17px; cursor:pointer; position:relative; transition:transform var(--transition), border-color var(--transition), box-shadow var(--transition);
  display:flex; flex-direction:column; gap:8px;
}
.wf-card:hover{ transform:translateY(-2px); border-color:var(--text-faint); box-shadow:var(--shadow); }
.wf-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.wf-card-title{ font-size:14.5px; font-weight:600; color:var(--text); line-height:1.3; }
.wf-fav{
  background:none; border:none; cursor:pointer; color:var(--text-faint); padding:2px; flex-shrink:0;
}
.wf-fav svg{ width:16px; height:16px; }
.wf-fav.active{ color:var(--amber); }
.wf-card-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.5; flex:1; }
.wf-card-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:4px; gap:6px; flex-wrap:wrap; }
.wf-tags{ display:flex; gap:5px; flex-wrap:wrap; }
.wf-tag{ font-family:var(--font-mono); font-size:9.5px; padding:2px 7px; border-radius:20px; background:var(--panel-3); color:var(--text-dim); border:1px solid var(--line-soft); }
.wf-actions{ display:flex; gap:5px; }
.wf-mini-btn{ background:var(--panel-2); border:1px solid var(--line); color:var(--text-faint); border-radius:6px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.wf-mini-btn svg{ width:13px; height:13px; }
.wf-mini-btn:hover{ color:var(--text); border-color:var(--text-faint); }

.empty-state{ padding:50px 20px; text-align:center; color:var(--text-faint); border:1.5px dashed var(--line); border-radius:var(--radius); }
.empty-state h3{ color:var(--text-dim); font-size:15px; margin-bottom:6px; }
.empty-state p{ font-size:13px; max-width:400px; margin:0 auto; }

/* ============================================================
   BUTTONS (generic)
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:9px;
  font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--line);
  background:var(--panel-2); color:var(--text); transition:all var(--transition);
}
.btn svg{ width:14px; height:14px; }
.btn:hover{ border-color:var(--text-faint); }
.btn-primary{ background:var(--signal); border-color:var(--signal); color:#07130f; }
.btn-primary:hover{ background:var(--signal-dim); border-color:var(--signal-dim); }
.btn-ghost{ background:none; }
.btn-sm{ padding:6px 11px; font-size:12px; }
.btn-danger{ color:var(--coral); }

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.overlay{
  position:fixed; inset:0; background:rgba(6,7,9,0.6); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  opacity:0; pointer-events:none; transition:opacity var(--transition);
}
.overlay.show{ opacity:1; pointer-events:auto; }
.modal{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);
  transform:translateY(12px) scale(0.98); transition:transform var(--transition);
}
.overlay.show .modal{ transform:translateY(0) scale(1); }
.modal.modal-lg{ max-width:880px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line-soft); position:sticky; top:0; background:var(--panel); z-index:2;}
.modal-head h3{ font-size:16px; }
.modal-head p{ margin:3px 0 0; font-size:12px; color:var(--text-faint); }
.modal-close{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.modal-body{ padding:20px 22px 24px; }
.modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 22px; border-top:1px solid var(--line-soft); position:sticky; bottom:0; background:var(--panel); }

/* form bits */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
.field .help{ font-size:11.5px; color:var(--text-faint); margin-top:4px; line-height:1.4; }
.field input[type=text], .field textarea, .field select{
  width:100%; padding:9px 11px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line);
  color:var(--text); font-size:13px; font-family:var(--font-body); resize:vertical;
}
.field textarea{ font-family:var(--font-mono); font-size:12.5px; line-height:1.6; min-height:110px; }
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--signal); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

/* variable pills inside template preview */
.tpl-preview{
  background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:14px 16px;
  font-family:var(--font-mono); font-size:12.5px; line-height:1.75; white-space:pre-wrap; color:var(--text);
  max-height:280px; overflow-y:auto;
}
.tpl-var{ background:rgba(94,230,200,0.14); color:var(--signal); padding:1px 4px; border-radius:4px; font-weight:600; }
[data-theme="light"] .tpl-var{ background:rgba(15,158,130,0.12); }

.section-tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line-soft); margin-bottom:16px; flex-wrap:wrap; }
.section-tab{ padding:9px 4px; margin-right:14px; font-size:13px; color:var(--text-faint); cursor:pointer; border-bottom:2px solid transparent; font-weight:600; }
.section-tab.active{ color:var(--text); border-color:var(--signal); }

.detail-block{ margin-bottom:18px; }
.detail-block h4{ font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.detail-list{ margin:0; padding-left:18px; font-size:13px; color:var(--text-dim); line-height:1.7; }

/* ============================================================
   PROMPT BUILDER
   ============================================================ */
.pb-layout{ display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
@media (max-width:900px){ .pb-layout{ grid-template-columns:1fr; } }
.pb-panel{ background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:16px; }
.pb-panel h3{ font-size:14px; margin-bottom:4px; }
.pb-panel .sub{ font-size:12px; color:var(--text-faint); margin-bottom:14px; }

.block-picker-item{
  border:1px solid var(--line-soft); border-radius:9px; padding:11px 13px; margin-bottom:8px; cursor:grab; background:var(--panel-2);
  transition:border-color var(--transition);
}
.block-picker-item:hover{ border-color:var(--signal); }
.bp-title-row{ display:flex; align-items:center; justify-content:between; gap:8px; }
.bp-title{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px; flex:1; }
.bp-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.bp-desc{ font-size:11.5px; color:var(--text-faint); margin-top:4px; line-height:1.5; }
.bp-add{ background:var(--panel-3); border:1px solid var(--line); color:var(--text-dim); border-radius:6px; width:24px; height:24px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.bp-add:hover{ color:var(--signal); border-color:var(--signal); }

.assembled-block{
  border:1px solid var(--line); border-radius:10px; padding:14px 15px; margin-bottom:12px; background:var(--panel-2);
}
.ab-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.ab-title{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; display:flex; align-items:center; gap:7px; flex:1; }
.ab-remove{ background:none; border:none; color:var(--text-faint); cursor:pointer; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:6px; }
.ab-remove:hover{ color:var(--coral); background:var(--panel-3); }
.ab-why{ font-size:11px; color:var(--text-faint); margin-bottom:8px; line-height:1.5; }
.ab-input{ width:100%; padding:8px 10px; border-radius:7px; background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:12.5px; font-family:var(--font-mono); }
.ab-input:focus{ border-color:var(--signal); }
select.ab-input{ font-family:var(--font-body); }

.pb-preview-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.model-select{ display:flex; gap:6px; }
.model-chip{ font-family:var(--font-mono); font-size:11px; padding:5px 10px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-faint); cursor:pointer; }
.model-chip.active{ border-color:var(--signal); color:var(--signal); background:rgba(94,230,200,0.08); }

.pb-empty{ text-align:center; padding:40px 10px; color:var(--text-faint); font-size:13px; border:1.5px dashed var(--line); border-radius:9px; }

/* ============================================================
   LOOP BUILDER extra
   ============================================================ */
.loop-flow{ display:flex; flex-direction:column; gap:0; margin-top:6px; }
.loop-step{ display:flex; gap:12px; }
.loop-step-num{ width:26px; height:26px; border-radius:50%; background:var(--panel-3); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color:var(--signal); flex-shrink:0; }
.loop-step-line{ width:1px; flex:1; background:var(--line); margin:2px 0 2px 13px; }
.loop-step-body{ padding-bottom:18px; flex:1; }
.loop-step-body h4{ font-size:13px; margin-bottom:2px; }
.loop-step-body p{ font-size:11.5px; color:var(--text-faint); margin:0 0 8px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--panel-3); border:1px solid var(--line); color:var(--text); padding:11px 18px; border-radius:9px;
  font-size:13px; display:flex; align-items:center; gap:9px; box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none;
  transition:all var(--transition);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast svg{ width:15px; height:15px; color:var(--signal); flex-shrink:0; }

/* ============================================================
   ONBOARDING
   ============================================================ */
.onb-steps{ display:flex; gap:6px; margin-bottom:18px; }
.onb-dot{ height:4px; flex:1; border-radius:3px; background:var(--line); }
.onb-dot.active{ background:var(--signal); }
.onb-icon{ width:46px; height:46px; border-radius:12px; background:var(--panel-3); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--signal); margin-bottom:14px; }
.onb-icon svg{ width:22px; height:22px; }

/* ============================================================
   HELP MODAL SHORTCUTS
   ============================================================ */
.kbd-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
.kbd-row:last-child{ border-bottom:none; }
.kbd{ font-family:var(--font-mono); font-size:11px; background:var(--panel-2); border:1px solid var(--line); padding:3px 7px; border-radius:5px; }

/* filters bar */
.filters-bar{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
.filter-select{ padding:8px 10px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-size:12.5px; }
.filter-toggle{ padding:8px 12px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.filter-toggle.active{ border-color:var(--signal); color:var(--signal); }

/* badge for detail modal category */
.badge{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10.5px; padding:3px 9px; border-radius:20px; border:1px solid; }

/* mobile */
@media (max-width:840px){
  .sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform var(--transition); box-shadow:var(--shadow); }
  .sidebar.open{ transform:translateX(0); }
  .hamburger{ display:flex; }
  .content{ padding:20px 16px 60px; }
  .stats-row{ grid-template-columns:repeat(2,1fr); }
  .row2{ grid-template-columns:1fr; }
}
.sidebar-scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:39; }
.sidebar-scrim.show{ display:block; }

<script>
/* =====================================================================
   DATA MODEL
   ===================================================================== */

const CATEGORY_META = {
  coding:        { label:"Coding & Debugging",        color:"#5ee6c8", icon:"code" },
  review:        { label:"Code Review & Refactoring",  color:"#a78bfa", icon:"eye" },
  docs:          { label:"Docs & Technical Writing",   color:"#ffb454", icon:"file" },
  architecture:  { label:"Architecture & Decisions",   color:"#ff7a68", icon:"layers" },
  learning:      { label:"Learning & Research",        color:"#7fb2ff", icon:"book" },
  custom:        { label:"My Workflows",               color:"#e8eaee", icon:"star" },
};

// Reusable variable placeholder syntax: {{variable_name}}
// WORKFLOWS: pre-built, tailored to a solo software engineer.
const DEFAULT_WORKFLOWS = [
{
  id:"wf-debug-1", category:"coding", title:"Debug from a stack trace",
  desc:"Paste an error + relevant code, get a root-cause analysis instead of a guess-and-check patch.",
  tags:["debugging","errors"], model:"Any (Claude/GPT/Copilot Chat)",
  template:`You are an expert {{language}} engineer pair-debugging with me.

CONTEXT
- Project: {{project_context}}
- What I expected: {{expected_behavior}}
- What actually happened: {{actual_behavior}}

ERROR / STACK TRACE
{{stack_trace}}

RELEVANT CODE
{{code_snippet}}

TASK
1. Identify the root cause (not just the symptom) — reason step by step before concluding.
2. Explain *why* it happens in plain language.
3. Give the minimal fix, then a more robust fix if relevant.
4. Flag anything else in this code that could cause a similar bug later.

Do not rewrite the whole file — only show the changed lines with a few lines of surrounding context.`,
  vars:["language","project_context","expected_behavior","actual_behavior","stack_trace","code_snippet"],
  bestPractices:[
    "Always paste the full stack trace, not a summary — the line numbers matter.",
    "State what you expected vs what happened; this stops the model from just re-describing the error.",
    "Ask for root cause reasoning before the fix, so you're not just papering over a symptom."
  ],
  example:"language: TypeScript · expected_behavior: 'form submits and redirects' · actual_behavior: 'silent failure, no redirect' · stack_trace: (paste from console) · code_snippet: (the submit handler)"
},
{
  id:"wf-newfeature-1", category:"coding", title:"Scaffold a new feature",
  desc:"Turn a one-line feature idea into a concrete implementation plan + file-by-file scaffold.",
  tags:["scaffolding","planning"], model:"Claude / GPT",
  template:`Act as a senior {{language}} engineer helping me implement a new feature in an existing codebase.

FEATURE REQUEST
{{feature_description}}

STACK / CONVENTIONS
{{stack_and_conventions}}

CONSTRAINTS
{{constraints}}

TASK
1. Ask up to 3 clarifying questions ONLY if something critical is ambiguous — otherwise proceed.
2. Propose a short implementation plan (files touched, new files, data flow).
3. Write the code for each file, in the order it should be built.
4. Call out edge cases and what tests I should write.

Reasoning strategy: think through the data flow end-to-end before writing code.`,
  vars:["language","feature_description","stack_and_conventions","constraints"],
  bestPractices:[
    "Give the model your actual conventions (folder structure, naming) or it'll invent its own.",
    "Explicitly ask it to plan before coding — this catches design issues early and cheaply.",
    "List constraints (no new dependencies, must be backward compatible, etc.) up front."
  ],
  example:"feature_description: 'Add CSV export to the reports page' · stack_and_conventions: 'Next.js 14, app router, Tailwind, REST API under /api'"
},
{
  id:"wf-explain-code-1", category:"coding", title:"Explain unfamiliar code",
  desc:"Drop in a file or function you didn't write and get a guided walkthrough, not just a paraphrase.",
  tags:["comprehension","onboarding"], model:"Any",
  template:`Explain the following {{language}} code to me as if I'm a competent engineer who is new to this specific codebase.

CODE
{{code_snippet}}

TASK
1. One-paragraph summary of what this code does and why it likely exists.
2. Walk through the control flow / data flow step by step.
3. Point out any non-obvious tricks, side effects, or assumptions baked in.
4. List follow-up questions I should ask the original author if I could.

Tone: direct, no filler, assume I can read code but don't know this domain yet.`,
  vars:["language","code_snippet"],
  bestPractices:[
    "Include imports/surrounding context if the snippet references other modules.",
    "Ask specifically for 'non-obvious tricks' — this is where AI explanations add the most value over just reading it yourself."
  ],
  example:"language: Python · code_snippet: (paste the function or class you're confused by)"
},
{
  id:"wf-review-1", category:"review", title:"PR self-review before opening",
  desc:"Run your own diff through a strict reviewer persona before a human ever sees it.",
  tags:["pr","quality"], model:"Claude (long context)",
  template:`You are a strict, senior code reviewer. Review this diff as if it were submitted to you as a PR — be direct, not polite-for-politeness-sake.

DIFF
{{diff}}

CONTEXT
- Purpose of this change: {{pr_purpose}}
- Areas I'm unsure about: {{concerns}}

REVIEW CRITERIA
- Correctness & edge cases
- Readability & naming
- Consistency with common {{language}} idioms
- Security or performance red flags
- Missing tests

OUTPUT FORMAT
- 🔴 Blocking issues (must fix)
- 🟡 Suggestions (nice to have)
- 🟢 What's good (be specific, not generic praise)

Quality check: if you find zero blocking issues, explicitly say the diff is safe to merge — don't invent nitpicks to seem thorough.`,
  vars:["diff","pr_purpose","concerns","language"],
  bestPractices:[
    "The 'quality check' line matters — without it, models tend to invent nitpicks to appear useful.",
    "List your own concerns first; it focuses the review on what you actually need eyes on.",
    "Use the traffic-light output format so you can scan results fast."
  ],
  example:"pr_purpose: 'add rate limiting to the auth endpoint' · concerns: 'not sure the Redis TTL logic is correct'"
},
{
  id:"wf-refactor-1", category:"review", title:"Refactor for readability",
  desc:"Get a refactor with reasoning attached, so you're not blindly accepting a rewrite.",
  tags:["refactor","clean-code"], model:"Any",
  template:`Refactor the following {{language}} code for readability and maintainability. Do not change external behavior.

CODE
{{code_snippet}}

GOALS (in priority order)
{{goals}}

RULES
- Preserve the public API / function signatures unless I say otherwise.
- Explain each significant change and why it's better — don't just show the result.
- If a change is a matter of taste rather than a real improvement, label it optional.

Output: refactored code first, then a short "what changed and why" list.`,
  vars:["language","code_snippet","goals"],
  bestPractices:[
    "Rank your goals (e.g. '1. reduce nesting 2. shorter functions 3. better names') so the model doesn't over-optimize the wrong thing.",
    "Ask it to label taste-based changes as optional — protects you from churn-y diffs."
  ],
  example:"goals: '1. reduce cyclomatic complexity 2. extract magic numbers to constants 3. improve variable names'"
},
{
  id:"wf-readme-1", category:"docs", title:"Generate a project README",
  desc:"Produce a README that documents what the project actually does, not a generic template.",
  tags:["readme","onboarding"], model:"Claude / GPT",
  template:`Write a README.md for this project.

PROJECT SUMMARY
{{project_summary}}

TECH STACK
{{tech_stack}}

KEY FILES / STRUCTURE
{{structure}}

AUDIENCE
{{audience}}

REQUIREMENTS
- Sections: overview, quickstart, project structure, configuration, common commands, troubleshooting.
- Quickstart must be copy-pasteable commands, no placeholders like "your-project-name" unless truly generic.
- Tone: {{tone}}. No marketing language, no emoji overload.
- Keep it under {{length}} words unless the project genuinely needs more.`,
  vars:["project_summary","tech_stack","structure","audience","tone","length"],
  bestPractices:[
    "Give real file/folder names — genuinely improves the 'project structure' section over a placeholder.",
    "Specify the audience (future-you, new hires, open-source contributors) — it changes what needs explaining."
  ],
  example:"audience: 'a new contributor cloning this for the first time' · tone: 'plain, no fluff'"
},
{
  id:"wf-docstring-1", category:"docs", title:"Write docstrings / inline comments",
  desc:"Backfill documentation for code that has none, tuned to your team's doc style.",
  tags:["comments","docstrings"], model:"Any",
  template:`Add {{doc_style}} documentation to the following {{language}} code.

CODE
{{code_snippet}}

RULES
- Document the *why*, not just the *what*, where it isn't obvious from the code itself.
- Don't comment trivial lines (e.g. "// increment i").
- Match the existing doc style/format if any is present in the snippet.
- Return the full code with documentation added — no other changes.`,
  vars:["doc_style","language","code_snippet"],
  bestPractices:[
    "Explicitly ban trivial comments — this is the #1 failure mode of AI-generated docs.",
    "Specify the doc format (JSDoc, Google-style docstrings, etc.) so output matches your linter."
  ],
  example:"doc_style: 'Google-style Python docstrings' · language: 'Python'"
},
{
  id:"wf-adr-1", category:"architecture", title:"Draft an Architecture Decision Record",
  desc:"Turn a half-formed technical decision into a proper ADR you can revisit later.",
  tags:["adr","decisions"], model:"Claude (reasoning)",
  template:`Help me write an Architecture Decision Record (ADR) for the following decision.

DECISION TO MAKE
{{decision}}

OPTIONS CONSIDERED
{{options}}

CONSTRAINTS
{{constraints}}

MY LEANING (if any)
{{leaning}}

TASK
1. Lay out each option with real tradeoffs (not surface-level pros/cons) — think about long-term maintenance, not just initial build speed.
2. Recommend one option and justify it against my constraints specifically.
3. Output in standard ADR format: Context, Decision, Consequences, Alternatives Considered.

Reasoning strategy: consider second-order consequences (what does this make harder later?) before recommending.`,
  vars:["decision","options","constraints","leaning"],
  bestPractices:[
    "List real options, even weak ones — comparative reasoning is more useful than a single recommendation.",
    "Sharing your leaning lets the model push back on it specifically, instead of vaguely agreeing."
  ],
  example:"decision: 'REST vs GraphQL for the new internal API' · constraints: 'small team, must ship in 3 weeks'"
},
{
  id:"wf-tradeoff-1", category:"architecture", title:"Evaluate a build-vs-buy tradeoff",
  desc:"Structured comparison for 'should we build this ourselves or use a library/service'.",
  tags:["tradeoffs","planning"], model:"Any",
  template:`I'm deciding whether to build or buy/use an existing solution for: {{problem}}

OPTIONS ON THE TABLE
{{options}}

MY PRIORITIES (ranked)
{{priorities}}

TASK
Compare on: implementation time, ongoing maintenance burden, cost, flexibility, vendor/dependency risk, and team learning curve.
Give a clear recommendation matched to my ranked priorities, and name the scenario under which you'd change your answer.`,
  vars:["problem","options","priorities"],
  bestPractices:[
    "Rank priorities explicitly — 'fastest to ship' and 'most flexible long-term' often point to different answers.",
    "Ask for the scenario that would flip the recommendation — makes the reasoning falsifiable, not just a confident guess."
  ],
  example:"problem: 'user authentication' · options: 'build custom JWT auth vs Auth0 vs Supabase Auth'"
},
{
  id:"wf-learn-1", category:"learning", title:"Learn a new concept fast",
  desc:"Get a structured ramp-up on an unfamiliar technology, scoped to what you actually need.",
  tags:["learning","onboarding"], model:"Any",
  template:`Teach me {{topic}} as efficiently as possible.

MY BACKGROUND
{{background}}

WHY I NEED THIS
{{goal}}

TASK
1. Explain the core mental model in a few sentences — the thing that makes everything else make sense.
2. Cover only the 20% of {{topic}} that gets me to my goal — skip the rest, but name what you're skipping.
3. Give one small, concrete example I can run/try myself.
4. List 2-3 common mistakes beginners make with this.

Format: plain prose, no unnecessary headers, as if explaining to a colleague over coffee.`,
  vars:["topic","background","goal"],
  bestPractices:[
    "State your existing background so it doesn't over-explain things you already know.",
    "Naming what's being skipped stops you from feeling like you got an incomplete answer."
  ],
  example:"topic: 'Rust ownership & borrowing' · background: 'strong in TS/JS, no systems languages' · goal: 'read and modify a small Rust CLI tool'"
},
{
  id:"wf-compare-1", category:"learning", title:"Compare tools/libraries objectively",
  desc:"Cut through marketing copy to get a grounded comparison for your specific use case.",
  tags:["research","comparison"], model:"Any (web-enabled preferred)",
  template:`Compare {{option_a}} vs {{option_b}} for the following specific use case: {{use_case}}

MY CONTEXT
{{context}}

TASK
- Compare only on dimensions relevant to my use case, not a generic feature list.
- Be explicit about where the comparison depends on version/date, since this can go stale.
- Give a recommendation, but flag if the honest answer is "it depends" and on what.
- Note if you're not confident to give a recommendation and current data would help.`,
  vars:["option_a","option_b","use_case","context"],
  bestPractices:[
    "Scope the comparison to your use case — generic 'X vs Y' comparisons are usually shallow.",
    "Ask it to flag staleness risk; library ecosystems move fast and training data ages."
  ],
  example:"option_a: 'Zustand' · option_b: 'Redux Toolkit' · use_case: 'client state for a mid-size dashboard app'"
},
];

/* =====================================================================
   PROMPT BUILDER BLOCK LIBRARY
   ===================================================================== */
const BLOCK_LIBRARY = [
  { key:"role", label:"Role", color:"#5ee6c8",
    why:"Sets who the model should act as. This shapes vocabulary, assumed expertise, and what it treats as 'obvious' vs worth explaining.",
    type:"select", options:["Senior software engineer","Staff engineer doing architecture review","Security-focused code reviewer","Patient technical teacher","Skeptical senior reviewer","Pragmatic startup CTO","Custom…"],
    placeholder:"e.g. Senior backend engineer specializing in distributed systems" },
  { key:"objective", label:"Objective", color:"#a78bfa",
    why:"The single clear outcome you want. Vague objectives produce vague, hedge-everything answers.",
    type:"text", placeholder:"e.g. Find the root cause of this bug and propose the minimal fix" },
  { key:"context", label:"Context", color:"#7fb2ff",
    why:"Background the model needs but shouldn't have to guess — your stack, constraints, prior attempts, audience.",
    type:"text", placeholder:"e.g. Next.js 14 app, Postgres via Prisma, this worked yesterday before a dependency bump" },
  { key:"constraints", label:"Constraints", color:"#ff7a68",
    why:"Hard boundaries the answer must respect — no new dependencies, must stay backward-compatible, time budget, etc. Prevents technically-correct-but-useless answers.",
    type:"text", placeholder:"e.g. No new npm dependencies. Must work on Node 18." },
  { key:"reasoning", label:"Reasoning strategy", color:"#ffb454",
    why:"Tells the model *how* to think, not just what to output — e.g. reason step-by-step before concluding, or consider multiple options before committing. Big impact on quality for non-trivial problems.",
    type:"select", options:["Think step-by-step before answering","Consider 2-3 options, then pick one and justify it","Identify root cause before proposing a fix","Work backward from the desired end state","No special reasoning needed — just answer"] },
  { key:"format", label:"Output format", color:"#5ee6c8",
    why:"Structures the response so it's usable, not just readable — code-only, a table, ranked list, or a specific template like an ADR.",
    type:"select", options:["Code only, minimal prose","Numbered step-by-step plan","Table comparing options","Short prose, no headers","Diff-style (only changed lines)","Structured report with headers"] },
  { key:"tone", label:"Tone", color:"#a78bfa",
    why:"Calibrates directness and formality. A 'blunt senior reviewer' tone surfaces problems a 'friendly assistant' tone tends to soften.",
    type:"select", options:["Direct and blunt, no hedging","Friendly and encouraging","Formal and precise","Concise, no filler","Explain like I'm new to this"] },
  { key:"examples", label:"Examples", color:"#7fb2ff",
    why:"One or two examples of the input/output you want anchors the model's format and depth far more reliably than instructions alone.",
    type:"text", placeholder:"e.g. Input: a stack trace → Output: root cause in 1 sentence, then fix" },
  { key:"quality", label:"Quality checks", color:"#ff7a68",
    why:"A self-check the model runs before finalizing its answer — e.g. 'don't invent nitpicks', 'flag any uncertainty'. Reduces overconfident or padded answers.",
    type:"select", options:["Don't invent issues just to seem thorough","Flag anything you're not confident about","Double-check the code actually compiles logically","State assumptions made explicitly","Keep the answer as short as correctness allows"] },
];

const MODEL_TIPS = {
  claude:"Claude follows structured prompts and XML-ish tags well. Long context (paste whole files) works reliably.",
  gpt:"GPT responds well to explicit output format instructions and numbered task lists.",
  copilot:"Keep prompts short and code-adjacent — Copilot Chat works best with the relevant file already open.",
};

/* =====================================================================
   STATE
   ===================================================================== */
const STORAGE_KEY = "ai_playbook_state_v1";
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    theme:"dark",
    explainerDismissed:false,
    onboardingDone:false,
    favorites:[],
    customWorkflows:[],
    deletedDefaults:[],
    savedPrompts:[],
    savedLoops:[],
    currentView:"dashboard",
  };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function allWorkflows(){
  const defaults = DEFAULT_WORKFLOWS.filter(w=>!state.deletedDefaults.includes(w.id));
  return [...defaults, ...state.customWorkflows];
}

function ic(name){ return ICONS[name] || ""; }

/* =====================================================================
   NAV
   ===================================================================== */
const NAV_ITEMS = [
  { view:"dashboard", label:"Dashboard", icon:"dashboard", group:"" },
  { view:"cat-coding", label:CATEGORY_META.coding.label, icon:"code", group:"Workflows", cat:"coding" },
  { view:"cat-review", label:CATEGORY_META.review.label, icon:"eye", group:"Workflows", cat:"review" },
  { view:"cat-docs", label:CATEGORY_META.docs.label, icon:"file", group:"Workflows", cat:"docs" },
  { view:"cat-architecture", label:CATEGORY_META.architecture.label, icon:"layers", group:"Workflows", cat:"architecture" },
  { view:"cat-learning", label:CATEGORY_META.learning.label, icon:"book", group:"Workflows", cat:"learning" },
  { view:"cat-custom", label:"My Workflows", icon:"star", group:"Workflows", cat:"custom" },
  { view:"promptbuilder", label:"Prompt Builder", icon:"hammer", group:"Build" },
  { view:"loopbuilder", label:"Loop Builder", icon:"loop", group:"Build" },
];

function renderNav(){
  const el = document.getElementById("navContainer");
  let html = "";
  let lastGroup = null;
  NAV_ITEMS.forEach(item=>{
    if(item.group && item.group !== lastGroup){
      html += `<div class="nav-label">${item.group}</div>`;
      lastGroup = item.group;
    } else if(!item.group){ lastGroup = null; }
    const count = item.cat ? allWorkflows().filter(w=>w.category===item.cat).length : null;
    html += `<button class="nav-item ${state.currentView===item.view?'active':''}" data-view="${item.view}">
      <span class="nav-ico">${ic(item.icon)}</span>
      <span>${item.label}</span>
      ${count!==null?`<span class="nav-count">${count}</span>`:''}
    </button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll(".nav-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{ navigate(btn.dataset.view); closeSidebarMobile(); });
  });
}

function navigate(view){
  state.currentView = view;
  saveState();
  renderNav();
  renderContent();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* =====================================================================
   RENDER: CONTENT ROUTER
   ===================================================================== */
function renderContent(){
  const el = document.getElementById("content");
  const v = state.currentView;
  if(v === "dashboard") el.innerHTML = renderDashboard();
  else if(v.startsWith("cat-")) el.innerHTML = renderCategoryPage(v.replace("cat-",""));
  else if(v === "promptbuilder") el.innerHTML = renderPromptBuilder();
  else if(v === "loopbuilder") el.innerHTML = renderLoopBuilder();
  attachContentHandlers();
}

/* ---------- Explainer banner (shared) ---------- */
function explainerHTML(force){
  if(state.explainerDismissed && !force) return "";
  return `

    <div class="explainer-ico">${ic("dashboard")}</div>
    <div>
      <h3>What is this?</h3>
      <p>This is your <b>Personal AI Playbook</b> — a self-contained toolkit of reusable AI prompt workflows, built for how you actually work as a solo developer. Instead of retyping context every time, you fill in a few variables and reuse a tested prompt.</p>

        <span><b>Workflows</b> — editable prompt templates with example values</span>

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const wfs = allWorkflows();
  const favCount = state.favorites.length;
  const customCount = state.customWorkflows.length;
  const cats = Object.keys(CATEGORY_META).filter(c=>c!=="custom");

  let catBlocks = cats.map(catKey=>{
    const meta = CATEGORY_META[catKey];
    const items = wfs.filter(w=>w.category===catKey).slice(0,3);
    if(items.length===0) return "";
    return `
    <div class="section-block">
      <div class="section-block-head">
        <h2><span class="cat-chip" style="border-color:${meta.color}55;color:${meta.color}">${ic(meta.icon)}</span> ${meta.label}</h2>
        <button class="btn btn-ghost btn-sm" data-view-jump="cat-${catKey}">View all →</button>
      </div>
      <p class="page-sub" style="margin:-8px 0 12px;">${categorySubtitle(catKey)}</p>
      <div class="workflow-grid">${items.map(w=>workflowCardHTML(w)).join("")}</div>
    </div>`;
  }).join("");

  return `
    <div class="page-head">
      <div class="page-eyebrow">Dashboard</div>
      <h1 class="page-title">Your AI workflows, at a glance</h1>
      <p class="page-sub">Reusable prompt systems tailored to coding, review, docs, architecture, and learning — so you stop re-explaining context from scratch every time.</p>
    </div>
    ${explainerHTML(false)}
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${wfs.length}</div><div class="stat-label">Total workflows</div></div>
      <div class="stat-card"><div class="stat-num">${favCount}</div><div class="stat-label">Favorited</div></div>
      <div class="stat-card"><div class="stat-num">${customCount}</div><div class="stat-label">Custom-built by you</div></div>
      <div class="stat-card"><div class="stat-num">${state.savedPrompts.length + state.savedLoops.length}</div><div class="stat-label">Saved from builders</div></div>
    </div>

}

function categorySubtitle(catKey){
  const subs = {
    coding:"Prompts for the moment you're staring at broken or unwritten code.",
    review:"Get a second pair of eyes before a human reviewer sees your work.",
    docs:"Turn tribal knowledge into documentation someone (including future you) can read.",
    architecture:"Structure fuzzy technical decisions into comparable, defensible choices.",
    learning:"Ramp up on new tools and concepts without wading through generic tutorials.",
    custom:"Workflows you've built or duplicated yourself, saved locally in this browser.",
  };
  return subs[catKey] || "";
}

/* ---------- Category Page ---------- */
function renderCategoryPage(catKey){

/* =====================================================================
   WORKFLOW DETAIL MODAL
   ===================================================================== */
function openWorkflowModal(id){
  const w = allWorkflows().find(x=>x.id===id);
  if(!w) return;
  const meta = CATEGORY_META[w.category];
  const isFav = state.favorites.includes(w.id);
  const isCustom = state.customWorkflows.some(x=>x.id===w.id);

  const body = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <span class="badge" style="border-color:${meta.color}55;color:${meta.color}">${ic(meta.icon)} ${meta.label}</span>
      <span class="badge" style="border-color:var(--line);color:var(--text-faint);">${escapeHTML(w.model||"Any model")}</span>
    </div>
    <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:18px;">${escapeHTML(w.desc)}</p>

    <div class="section-tabs" id="wfTabs">
      <div class="section-tab active" data-tab="template">Template</div>
      <div class="section-tab" data-tab="fill">Fill it in</div>
      <div class="section-tab" data-tab="practices">Best practices</div>
    </div>

    <div id="wfTabContent"></div>
  `;

  showModal({
    title: w.title,
    sub: "Editable prompt template — fill in variables or copy as-is",
    lg:true,
    body,
    footButtons:[
      { label:"Duplicate", icon:"dup", action:()=>{ duplicateWorkflow(w.id); closeModal(); } },
      isCustom ? { label:"Delete", icon:"trash", danger:true, action:()=>{ deleteWorkflow(w.id); closeModal(); } } : null,
      { label: isFav ? "Unfavorite" : "Favorite", icon:isFav?"starfull":"star", action:()=>{ toggleFavorite(w.id); closeModal(); openWorkflowModal(w.id); } },
      { label:"Copy template", icon:"copy", primary:true, action:()=>{ copyToClipboard(w.template); toast("Template copied to clipboard"); } },
    ].filter(Boolean)
  });

  let activeTab = "template";
  function renderTab(){
    const el = document.getElementById("wfTabContent");
    if(activeTab==="template"){
      el.innerHTML = `<div class="tpl-preview">${highlightVars(w.template)}</div>
        <div class="field" style="margin-top:14px;">
          <label>Example values</label>
          <p class="help" style="margin-top:0;">${escapeHTML(w.example||"—")}</p>
        </div>`;
    } else if(activeTab==="fill"){
      const varsHTML = (w.vars||[]).map(v=>`
        <div class="field">
          <label>${escapeHTML(v)}</label>
          <textarea data-fillvar="${v}" rows="2" placeholder="Enter ${escapeHTML(v)}…"></textarea>
        </div>`).join("");
      el.innerHTML = `
        <div>${varsHTML || '<p class="help">This template has no variables to fill.</p>'}</div>
        <div class="field">
          <label>Live preview</label>
          <div class="tpl-preview" id="fillPreview">${highlightVars(w.template)}</div>
        </div>
        <button class="btn btn-primary" id="copyFilledBtn">${ic("copy")} Copy filled prompt</button>
      `;
      const inputs = el.querySelectorAll("[data-fillvar]");
      function updatePreview(){
        let txt = w.template;
        inputs.forEach(inp=>{
          const val = inp.value.trim();
          const re = new RegExp("\\\\{\\\\{"+inp.dataset.fillvar+"\\\\}\\\\}","g");
          txt = txt.replace(re, val ? val : "{{"+inp.dataset.fillvar+"}}");
        });
        document.getElementById("fillPreview").innerHTML = highlightVars(txt);
      }
      inputs.forEach(inp=>inp.addEventListener("input", updatePreview));
      el.querySelector("#copyFilledBtn").addEventListener("click", ()=>{
        let txt = w.template;
        inputs.forEach(inp=>{
          const val = inp.value.trim();
          const re = new RegExp("\\\\{\\\\{"+inp.dataset.fillvar+"\\\\}\\\\}","g");
          txt = txt.replace(re, val ? val : "["+inp.dataset.fillvar+"]");
        });
        copyToClipboard(txt);
        toast("Filled prompt copied to clipboard");
      });
    } else if(activeTab==="practices"){
      el.innerHTML = `
        <div class="detail-block">
          <h4>${ic("check")} Best practices</h4>
          <ul class="detail-list">${(w.bestPractices||[]).map(p=>`<li>${escapeHTML(p)}</li>`).join("") || "<li>No notes yet.</li>"}</ul>
        </div>
        <div class="detail-block">
          <h4>Variables used</h4>
          <ul class="detail-list">${(w.vars||[]).map(v=>`<li><code class="mono">{{${escapeHTML(v)}}}</code></li>`).join("") || "<li>None</li>"}</ul>
        </div>`;
    }
  }
  renderTab();
  document.querySelectorAll("#wfTabs .section-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll("#wfTabs .section-tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      activeTab = tab.dataset.tab;
      renderTab();
    });
  });
}

function highlightVars(txt){
  return escapeHTML(txt).replace(/\{\{(.+?)\}\}/g, '<span class="tpl-var">{{$1}}</span>');
}

/* =====================================================================
   WORKFLOW ACTIONS
   ===================================================================== */
function toggleFavorite(id){
  if(state.favorites.includes(id)) state.favorites = state.favorites.filter(x=>x!==id);
  else state.favorites.push(id);
  saveState(); renderContent();
}
function duplicateWorkflow(id){
  const w = allWorkflows().find(x=>x.id===id);
  if(!w) return;
  const copy = JSON.parse(JSON.stringify(w));
  copy.id = "custom-"+Date.now();
  copy.title = w.title + " (copy)";
  copy.category = "custom";
  state.customWorkflows.push(copy);
  saveState(); renderNav(); renderContent();
  toast("Duplicated to My Workflows");
}
function deleteWorkflow(id){
  if(state.customWorkflows.some(x=>x.id===id)){
    state.customWorkflows = state.customWorkflows.filter(x=>x.id!==id);
  } else {
    state.deletedDefaults.push(id);
  }
  state.favorites = state.favorites.filter(x=>x!==id);
  saveState(); renderNav(); renderContent();
  toast("Workflow deleted");
}
function copyToClipboard(text){
  navigator.clipboard?.writeText(text).catch(()=>{
    const ta = document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  });
}

      <textarea id="nwTemplate" rows="8" placeholder="Write your prompt. Use {{variable_name}} for reusable parts."></textarea>
      <div class="help">Anything wrapped in <code class="mono">{{like_this}}</code> becomes an editable variable when you use the workflow later.</div>
    </div>
    <div class="field"><label>Best practices (one per line, optional)</label><textarea id="nwPractices" rows="3" placeholder="One tip per line"></textarea></div>
  `;
  showModal({

        const wf = {
          id:"custom-"+Date.now(),
          title, desc: document.getElementById("nwDesc").value.trim() || "Custom workflow",
          category:"custom",
          tags: document.getElementById("nwTags").value.split(",").map(s=>s.trim()).filter(Boolean),
          model: document.getElementById("nwModel").value.trim() || "Any",

          bestPractices: document.getElementById("nwPractices").value.split("\n").map(s=>s.trim()).filter(Boolean),

        };
        state.customWorkflows.push(wf);
        saveState(); renderNav(); renderContent(); closeModal();
        toast("Workflow saved to My Workflows");
      }}
    ]
  });

   PROMPT BUILDER
   ===================================================================== */
let pbAssembled = []; // array of {key, value}
let pbModel = "claude";

function renderPromptBuilder(){
  return `
    <div class="page-head">
      <div class="page-eyebrow">Build</div>
      <h1 class="page-title">Prompt Builder</h1>
      <p class="page-sub">Assemble a prompt from reusable building blocks — role, objective, context, constraints, reasoning strategy, output format, tone, examples, and quality checks — with a live preview as you go.</p>
    </div>
    ${explainerHTML(true) === "" ? "" : ""}
    <div class="explainer" style="margin-bottom:20px;">
      <div class="explainer-ico">${ic("hammer")}</div>
      <div>
        <h3>How this works</h3>
        <p>Click a block on the left to add it to your prompt. Each block is one ingredient of a well-structured prompt — hover or read the small text under each to see what it does and why it improves your results. Fill in the fields, and the full prompt builds itself on the right in real time.</p>
      </div>
    </div>
    <div class="pb-layout">
      <div class="pb-panel">
        <h3>Building blocks</h3>
        <div class="sub">Click + to add a block to your prompt.</div>
        <div id="blockPicker">${BLOCK_LIBRARY.map(b=>blockPickerItemHTML(b)).join("")}</div>
      </div>
      <div class="pb-panel">
        <div class="pb-preview-head">
          <h3 style="margin:0;">Your prompt</h3>
          <div class="model-select" id="modelSelect">
            <div class="model-chip ${pbModel==='claude'?'active':''}" data-model="claude">Claude</div>
            <div class="model-chip ${pbModel==='gpt'?'active':''}" data-model="gpt">GPT</div>
            <div class="model-chip ${pbModel==='copilot'?'active':''}" data-model="copilot">Copilot</div>
          </div>
        </div>
        <div class="help" style="margin-bottom:14px;">${MODEL_TIPS[pbModel]}</div>
        <div id="assembledBlocks">${pbAssembled.length ? pbAssembled.map((b,i)=>assembledBlockHTML(b,i)).join("") : `<div class="pb-empty">No blocks added yet. Pick some from the left to start building.</div>`}</div>
        <div class="field" style="margin-top:18px;">
          <label>Live preview</label>
          <div class="tpl-preview" id="pbPreview">${assemblePromptText() || "<span style='color:var(--text-faint)'>Your assembled prompt will appear here…</span>"}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="pbCopyBtn">${ic("copy")} Copy prompt</button>
          <button class="btn" id="pbSaveBtn">${ic("check")} Save as workflow</button>
          <button class="btn btn-ghost" id="pbClearBtn">Clear all</button>
        </div>
      </div>
    </div>
  `;
}

function blockPickerItemHTML(b){
  return `<div class="block-picker-item" data-add-block="${b.key}">
    <div class="bp-title-row">
      <div class="bp-title"><span class="bp-dot" style="background:${b.color}"></span>${b.label}</div>
      <button class="bp-add" data-add-block-btn="${b.key}" title="Add block">${ic("plus")}</button>
    </div>
    <div class="bp-desc">${b.why}</div>
  </div>`;
}

function assembledBlockHTML(b, idx){
  const meta = BLOCK_LIBRARY.find(x=>x.key===b.key);
  let inputHTML = "";
  if(meta.type==="select"){
    inputHTML = `<select class="ab-input" data-ab-idx="${idx}">
      ${meta.options.map(o=>`<option ${b.value===o?'selected':''}>${escapeHTML(o)}</option>`).join("")}
    </select>`;
    if(b.value && !meta.options.includes(b.value)){
      inputHTML = `<textarea class="ab-input" data-ab-idx="${idx}" rows="2">${escapeHTML(b.value)}</textarea>`;
    }
  } else {
    inputHTML = `<textarea class="ab-input" data-ab-idx="${idx}" rows="2" placeholder="${meta.placeholder||''}">${escapeHTML(b.value||"")}</textarea>`;
  }
  return `<div class="assembled-block">
    <div class="ab-head">
      <div class="ab-title"><span class="bp-dot" style="background:${meta.color}"></span>${meta.label}</div>
      <button class="ab-remove" data-remove-idx="${idx}" title="Remove block">&times;</button>
    </div>
    <div class="ab-why">${meta.why}</div>
    ${inputHTML}
  </div>`;
}

function assemblePromptText(){
  if(pbAssembled.length===0) return "";
  return pbAssembled.filter(b=>b.value && b.value.trim()).map(b=>{
    const meta = BLOCK_LIBRARY.find(x=>x.key===b.key);
    return `[${meta.label.toUpperCase()}]\n${b.value.trim()}`;
  }).join("\n\n");
}

function pbAddBlock(key){
  pbAssembled.push({ key, value:"" });
  renderContent();
}
function pbRemoveBlock(idx){
  pbAssembled.splice(idx,1);
  renderContent();
}
function pbUpdatePreview(){
  document.getElementById("pbPreview").innerHTML = escapeHTML(assemblePromptText()) || "<span style='color:var(--text-faint)'>Your assembled prompt will appear here…</span>";
}

/* =====================================================================
