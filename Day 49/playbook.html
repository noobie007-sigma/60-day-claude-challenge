let loopState = {
  basePrompt:"",
  goal:"",
  evalCriteria:"",
  strategy:"Try an approach, check it against the evaluation criteria, revise, repeat.",
  stopConditions:"",
  maxIterations:5,
  safety:"Stop and ask me before taking any destructive or irreversible action (deleting data, force-pushing, deploying).",
};

function renderLoopBuilder(){
  return `
    <div class="page-head">
      <div class="page-eyebrow">Build</div>
      <h1 class="page-title">Loop Builder</h1>
      <p class="page-sub">Turn any normal prompt into a self-checking, iterative prompt. Instead of getting one answer, the model tries, evaluates itself against your criteria, and improves — until your stop conditions are met.</p>
    </div>
    <div class="explainer" style="margin-bottom:20px;">
      <div class="explainer-ico">${ic("loop")}</div>
      <div>
        <h3>What is a "loop" prompt?</h3>
        <p>A normal prompt gives you one attempt. A <b>loop prompt</b> instructs the model to repeat a cycle — attempt, self-evaluate, revise — inside a single response (or across turns in a coding agent), and to stop only when it meets criteria you define. This is useful for things like "keep refining this until all tests pass" or "iterate on this copy until it's genuinely tight."</p>
      </div>
    </div>

    <div class="pb-layout">
      <div class="pb-panel">
        <h3>Loop configuration</h3>
        <div class="sub">Fill in each piece — every field maps to a part of the generated loop prompt.</div>

        <div class="field">
          <label>Base task / prompt</label>
          <textarea id="loopBase" rows="3" placeholder="e.g. Write a function that parses this log format and extracts error codes.">${escapeHTML(loopState.basePrompt)}</textarea>
          <div class="help">The underlying task you want done — the loop wraps around this.</div>
        </div>

        <div class="field">
          <label>Goal</label>
          <textarea id="loopGoal" rows="2" placeholder="e.g. A parser that handles all 4 known log formats with zero false negatives.">${escapeHTML(loopState.goal)}</textarea>
          <div class="help">What "done" looks like — the target the loop is optimizing toward.</div>
        </div>

        <div class="field">
          <label>Evaluation criteria</label>
          <textarea id="loopEval" rows="2" placeholder="e.g. Run against the 3 sample log files I provided; all error codes must be extracted correctly.">${escapeHTML(loopState.evalCriteria)}</textarea>
          <div class="help">How the model should judge its own attempt each cycle. Be as concrete/testable as possible.</div>
        </div>

        <div class="field">
          <label>Improvement strategy</label>
          <select id="loopStrategy">
            ${["Try an approach, check it against the evaluation criteria, revise, repeat.",
               "Generate 2-3 variations, evaluate each, keep the best, refine further.",
               "Start minimal, then add complexity only where the evaluation reveals gaps.",
               "Find the single biggest weakness each cycle and fix only that."]
               .map(o=>`<option ${loopState.strategy===o?'selected':''}>${o}</option>`).join("")}
          </select>
          <div class="help">How the model should approach revising between cycles — not just "try again."</div>
        </div>

        <div class="row2">
          <div class="field">
            <label>Stop conditions</label>
            <textarea id="loopStop" rows="2" placeholder="e.g. All 3 sample files pass, OR 5 iterations reached, whichever first.">${escapeHTML(loopState.stopConditions)}</textarea>
            <div class="help">Exact condition(s) that end the loop. Without this, loops run too long or never feel "done."</div>
          </div>
          <div class="field">
            <label>Max iterations</label>
            <input type="text" id="loopMax" value="${loopState.maxIterations}">
            <div class="help">Hard ceiling as a safety net, even if stop conditions aren't met.</div>
          </div>
        </div>

        <div class="field">
          <label>Safety rules</label>
          <textarea id="loopSafety" rows="2">${escapeHTML(loopState.safety)}</textarea>
          <div class="help">Guardrails the loop must never cross on its own — irreversible actions, scope creep, etc.</div>
        </div>

        <button class="btn btn-primary" id="loopGenerateBtn" style="width:100%;justify-content:center;">${ic("loop")} Generate loop prompt</button>
      </div>

      <div class="pb-panel">
        <h3>How the loop will run</h3>
        <div class="sub">A preview of the cycle your prompt will instruct the model to follow.</div>
        <div class="loop-flow">
          <div class="loop-step">
            <div><div class="loop-step-num">1</div><div class="loop-step-line"></div></div>
            <div class="loop-step-body"><h4>Attempt</h4><p>Model attempts the base task.</p></div>
          </div>
          <div class="loop-step">
            <div><div class="loop-step-num">2</div><div class="loop-step-line"></div></div>
            <div class="loop-step-body"><h4>Self-evaluate</h4><p>Checks the attempt against your evaluation criteria, honestly.</p></div>
          </div>
          <div class="loop-step">
            <div><div class="loop-step-num">3</div><div class="loop-step-line"></div></div>
            <div class="loop-step-body"><h4>Revise</h4><p>Applies the improvement strategy to fix the biggest gap.</p></div>
          </div>
          <div class="loop-step">
            <div><div class="loop-step-num">4</div></div>
            <div class="loop-step-body"><h4>Stop or repeat</h4><p>Stops if stop conditions or max iterations are hit — otherwise loops back to step 1.</p></div>
          </div>
        </div>
        <div class="field">
          <label>Generated loop prompt</label>
          <div class="tpl-preview" id="loopPreview">${escapeHTML(generateLoopPrompt())}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="loopCopyBtn">${ic("copy")} Copy loop prompt</button>
          <button class="btn" id="loopSaveBtn">${ic("check")} Save as workflow</button>
        </div>
      </div>
    </div>
  `;
}

function generateLoopPrompt(){
  if(!loopState.basePrompt.trim()) return "Fill in the fields on the left to generate your loop prompt…";
  return `You will work in an autonomous improvement loop. Do not stop after one attempt.

BASE TASK
${loopState.basePrompt}

GOAL
${loopState.goal || "(define what 'done' looks like)"}

LOOP PROCEDURE — repeat this cycle:
1. ATTEMPT: Produce your best attempt at the base task.
2. SELF-EVALUATE: Judge the attempt honestly against these criteria: ${loopState.evalCriteria || "(define evaluation criteria)"}
3. REVISE: ${loopState.strategy}
4. Repeat from step 1 unless a stop condition below is met.

STOP CONDITIONS
${loopState.stopConditions || "(define when to stop)"} — OR a maximum of ${loopState.maxIterations || 5} iterations, whichever comes first.

SAFETY RULES
${loopState.safety}

At the end, report: how many iterations you ran, what changed each cycle, and why you stopped.`;
}

/* =====================================================================
   GENERIC MODAL SYSTEM
   ===================================================================== */
function showModal({title, sub, body, lg, footButtons}){
  let overlay = document.getElementById("dynamicOverlay");
  if(overlay) overlay.remove();
  overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "dynamicOverlay";
  overlay.innerHTML = `
    <div class="modal ${lg?'modal-lg':''}">
      <div class="modal-head">
        <div><h3>${escapeHTML(title)}</h3>${sub?`<p>${escapeHTML(sub)}</p>`:''}</div>
        <button class="modal-close" id="dynModalClose">&times;</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footButtons && footButtons.length ? `<div class="modal-foot">
        ${footButtons.map((b,i)=>`<button class="btn ${b.primary?'btn-primary':''} ${b.danger?'btn-danger':''}" data-footbtn="${i}">${ic(b.icon)||''} ${escapeHTML(b.label)}</button>`).join("")}
      </div>`:''}
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add("show"));
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById("dynModalClose").addEventListener("click", closeModal);
  if(footButtons){
    footButtons.forEach((b,i)=>{
      overlay.querySelector(`[data-footbtn="${i}"]`)?.addEventListener("click", b.action);
    });
  }
}
function closeModal(){
  const overlay = document.getElementById("dynamicOverlay");
  if(overlay){ overlay.classList.remove("show"); setTimeout(()=>overlay.remove(), 200); }
}

/* =====================================================================
   TOAST
   ===================================================================== */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = `${ic("check")}<span>${escapeHTML(msg)}</span>`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* =====================================================================
   HELP / SHORTCUTS / ONBOARDING MODALS
   ===================================================================== */
function openHelpModal(){
  showModal({
    title:"What is the AI Playbook?",
    sub:"A quick orientation",
    lg:true,
    body:`
    <p style="font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-bottom:16px;">This app is a personal, self-contained toolkit of AI prompt workflows built around how you use AI as a solo developer. Everything is saved locally in this browser — nothing is sent anywhere.</p>
    <div class="detail-block">
      <h4>Main sections</h4>
      <ul class="detail-list">
        <li><b>Dashboard</b> — an overview of all your workflows, grouped by category.</li>
        <li><b>Category pages</b> (Coding, Review, Docs, Architecture, Learning) — ready-made, editable prompt templates for that kind of task.</li>
        <li><b>My Workflows</b> — anything you've built from scratch or duplicated and customized.</li>
        <li><b>Prompt Builder</b> — assemble a prompt from labeled building blocks (role, objective, context, constraints, reasoning strategy, output format, tone, examples, quality checks), with a live preview.</li>
        <li><b>Loop Builder</b> — convert any prompt into a self-checking loop by defining a goal, evaluation criteria, an improvement strategy, stop conditions, and safety rules.</li>
      </ul>
    </div>
    <div class="detail-block">
      <h4>Things you can do everywhere</h4>
      <ul class="detail-list">
        <li>Click any workflow card to view, edit variables, and copy it.</li>
        <li>Favorite (★), duplicate, or delete workflows — duplicates go to My Workflows so you can customize freely.</li>
        <li>Search across everything from the top bar.</li>
        <li>Export your whole playbook to a JSON file, or import one back in.</li>
      </ul>
    </div>`,
    footButtons:[{ label:"Got it", icon:"check", primary:true, action:closeModal }]
  });
}

function openShortcutsModal(){
  const rows = [
    ["/","Focus search"],
    ["T","Toggle dark / light mode"],
    ["N","New custom workflow"],
    ["Shift + /","Open 'What is this?'"],
    ["Shift + K","Open this shortcuts list"],
    ["Esc","Close any open modal"],
  ];
  showModal({
    title:"Keyboard shortcuts",
    body: rows.map(r=>`<div class="kbd-row"><span>${r[1]}</span><span class="kbd">${r[0]}</span></div>`).join(""),
    footButtons:[{ label:"Close", primary:true, action:closeModal }]
  });
}

function runOnboarding(){
  const steps = [
    { icon:"dashboard", title:"Welcome to your AI Playbook", body:"A personal toolkit of reusable AI prompt workflows, tuned to your work as a solo developer — coding, review, docs, architecture, and learning. Everything lives in this browser via local storage." },
    { icon:"code", title:"Ready-made workflows", body:"Browse categories in the sidebar. Every workflow is an editable template — click one, fill in a few variables, and copy a ready-to-use prompt." },
    { icon:"hammer", title:"Build your own prompts", body:"The Prompt Builder lets you snap together building blocks — role, objective, constraints, tone, and more — with a live preview, no blank page required." },
    { icon:"loop", title:"Automate iteration", body:"The Loop Builder turns any task into a self-checking loop: define a goal, how to evaluate progress, and when to stop." },
  ];
  let idx = 0;
  function render(){
    const s = steps[idx];
    showModal({
      title:"", body:`
      <div class="onb-steps">${steps.map((_,i)=>`<div class="onb-dot ${i<=idx?'active':''}"></div>`).join("")}</div>
      <div class="onb-icon">${ic(s.icon)}</div>
      <h2 style="font-size:20px;margin-bottom:8px;">${s.title}</h2>
      <p style="color:var(--text-dim);font-size:13.5px;line-height:1.6;">${s.body}</p>
      `,
      footButtons:[
        idx>0 ? { label:"Back", action:()=>{ idx--; render(); } } : null,
        { label: idx===steps.length-1 ? "Get started" : "Next", primary:true, action:()=>{
            if(idx===steps.length-1){ state.onboardingDone=true; saveState(); closeModal(); }
            else { idx++; render(); }
          } },
      ].filter(Boolean)
    });
  }
  render();
}

/* =====================================================================
   SEARCH
   ===================================================================== */
function performGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(!q){ renderContent(); return; }
  const wfs = allWorkflows().filter(w=>
    w.title.toLowerCase().includes(q) ||
    w.desc.toLowerCase().includes(q) ||
    (w.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
    w.template.toLowerCase().includes(q)
  );
  const el = document.getElementById("content");
  el.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">Search</div>
      <h1 class="page-title">Results for "${escapeHTML(query)}"</h1>
      <p class="page-sub">${wfs.length} workflow${wfs.length===1?'':'s'} found across all categories.</p>
    </div>
    <div class="workflow-grid">${wfs.length ? wfs.map(w=>workflowCardHTML(w)).join("") : `<div class="empty-state" style="grid-column:1/-1;"><h3>No matches</h3><p>Try a different search term, or build a new workflow from the Prompt Builder.</p></div>`}</div>
  `;
  attachContentHandlers();
}

/* =====================================================================
   EVENT DELEGATION FOR CONTENT AREA
   ===================================================================== */
function attachContentHandlers(){
  const el = document.getElementById("content");

  el.querySelector("#explainerClose")?.addEventListener("click", ()=>{
    state.explainerDismissed = true; saveState(); renderContent();
  });

  el.querySelectorAll("[data-view-jump]").forEach(b=>b.addEventListener("click", ()=>navigate(b.dataset.viewJump)));

  el.querySelectorAll("[data-open-workflow]").forEach(card=>{
    card.addEventListener("click", (e)=>{
      if(e.target.closest("[data-fav],[data-copy],[data-dup]")) return;
      openWorkflowModal(card.dataset.openWorkflow);
    });
  });
  el.querySelectorAll("[data-fav]").forEach(b=>b.addEventListener("click",(e)=>{ e.stopPropagation(); toggleFavorite(b.dataset.fav); }));
  el.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",(e)=>{
    e.stopPropagation();
    const w = allWorkflows().find(x=>x.id===b.dataset.copy);
    copyToClipboard(w.template); toast("Template copied to clipboard");
  }));
  el.querySelectorAll("[data-dup]").forEach(b=>b.addEventListener("click",(e)=>{ e.stopPropagation(); duplicateWorkflow(b.dataset.dup); }));

  el.querySelector("#newWorkflowBtn")?.addEventListener("click", openNewWorkflowModal);
  el.querySelector("#newWorkflowBtnAlt")?.addEventListener("click", openNewWorkflowModal);

  // category search/filter
  const catSearch = el.querySelector("#catSearch");
  const favToggle = el.querySelector("#favOnlyToggle");
  let favOnly = false;
  function applyCatFilter(){
    const q = (catSearch?.value||"").toLowerCase();
    const catKey = state.currentView.replace("cat-","");
    let wfs = allWorkflows().filter(w=>w.category===catKey);
    if(q) wfs = wfs.filter(w=>w.title.toLowerCase().includes(q)||w.desc.toLowerCase().includes(q)||(w.tags||[]).some(t=>t.toLowerCase().includes(q)));
    if(favOnly) wfs = wfs.filter(w=>state.favorites.includes(w.id));
    document.getElementById("catGrid").innerHTML = wfs.length ? wfs.map(w=>workflowCardHTML(w)).join("") : emptyStateFor(catKey);
    attachContentHandlers();
  }
  catSearch?.addEventListener("input", applyCatFilter);
  favToggle?.addEventListener("click", ()=>{ favOnly=!favOnly; favToggle.classList.toggle("active",favOnly); applyCatFilter(); });

  // prompt builder
  el.querySelectorAll("[data-add-block-btn]").forEach(b=>b.addEventListener("click",()=>pbAddBlock(b.dataset.addBlockBtn)));
  el.querySelectorAll(".block-picker-item").forEach(item=>item.addEventListener("click",(e)=>{
    if(e.target.closest("[data-add-block-btn]")) return;
    pbAddBlock(item.dataset.addBlock);
  }));
  el.querySelectorAll("[data-remove-idx]").forEach(b=>b.addEventListener("click",()=>pbRemoveBlock(parseInt(b.dataset.removeIdx))));
  el.querySelectorAll("[data-ab-idx]").forEach(inp=>inp.addEventListener("input",()=>{
    pbAssembled[parseInt(inp.dataset.abIdx)].value = inp.value;
    pbUpdatePreview();
  }));
  el.querySelectorAll("[data-model]").forEach(chip=>chip.addEventListener("click",()=>{ pbModel = chip.dataset.model; renderContent(); }));
  el.querySelector("#pbCopyBtn")?.addEventListener("click",()=>{
    const txt = assemblePromptText();
    if(!txt){ toast("Add some blocks first"); return; }
    copyToClipboard(txt); toast("Prompt copied to clipboard");
  });
  el.querySelector("#pbClearBtn")?.addEventListener("click",()=>{ pbAssembled=[]; renderContent(); });
  el.querySelector("#pbSaveBtn")?.addEventListener("click",()=>{
    const txt = assemblePromptText();
    if(!txt){ toast("Add some blocks first"); return; }
    const wf = { id:"custom-"+Date.now(), title:"Custom-built prompt", desc:"Built with the Prompt Builder", category:"custom", tags:["prompt-builder"], model:pbModel, template:txt, vars:[], bestPractices:[], example:"" };
    state.customWorkflows.push(wf); state.savedPrompts.push(wf.id); saveState(); renderNav();
    toast("Saved to My Workflows");
  });

  // loop builder
  ["loopBase","loopGoal","loopEval","loopStrategy","loopStop","loopMax","loopSafety"].forEach(id=>{
    const node = el.querySelector("#"+id);
    node?.addEventListener("input", ()=>{
      const map = { loopBase:"basePrompt", loopGoal:"goal", loopEval:"evalCriteria", loopStrategy:"strategy", loopStop:"stopConditions", loopMax:"maxIterations", loopSafety:"safety" };
      loopState[map[id]] = node.value;
      const pv = document.getElementById("loopPreview");
      if(pv) pv.textContent = generateLoopPrompt();
    });
  });
  el.querySelector("#loopGenerateBtn")?.addEventListener("click",()=>{
    document.getElementById("loopPreview").textContent = generateLoopPrompt();
    toast("Loop prompt generated");
  });
  el.querySelector("#loopCopyBtn")?.addEventListener("click",()=>{
    const txt = generateLoopPrompt();
    copyToClipboard(txt); toast("Loop prompt copied to clipboard");
  });
  el.querySelector("#loopSaveBtn")?.addEventListener("click",()=>{
    const txt = generateLoopPrompt();
    const wf = { id:"custom-"+Date.now(), title:"Loop: "+(loopState.goal||"Custom loop"), desc:"Built with the Loop Builder", category:"custom", tags:["loop-builder"], model:"Any", template:txt, vars:[], bestPractices:[], example:"" };
    state.customWorkflows.push(wf); state.savedLoops.push(wf.id); saveState(); renderNav();
    toast("Saved to My Workflows");
  });
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function escapeHTML(str){
  if(str===undefined || str===null) return "";
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* =====================================================================
   GLOBAL UI WIRING
   ===================================================================== */
function applyTheme(){
  document.body.setAttribute("data-theme", state.theme);
  const icon = document.getElementById("themeIcon");
  icon.innerHTML = state.theme==="dark"
    ? `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`
    : `<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>`;
}
document.getElementById("themeBtn").addEventListener("click", ()=>{
  state.theme = state.theme==="dark" ? "light" : "dark";
  saveState(); applyTheme();
});
document.getElementById("helpBtnTop").addEventListener("click", openHelpModal);
document.getElementById("helpBtnFoot").addEventListener("click", openHelpModal);
document.getElementById("kbdBtn").addEventListener("click", openShortcutsModal);

document.getElementById("hamburger").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("scrim").classList.add("show");
});
function closeSidebarMobile(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrim").classList.remove("show");
}
document.getElementById("scrim").addEventListener("click", closeSidebarMobile);

const searchInput = document.getElementById("globalSearch");
let searchDebounce;
searchInput.addEventListener("input", ()=>{
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{
    if(searchInput.value.trim()) performGlobalSearch(searchInput.value);
    else renderContent();
  }, 150);
});

document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "ai-playbook-export.json"; a.click();
  URL.revokeObjectURL(url);
  toast("Exported your playbook");
});
document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      state = { ...state, ...imported };
      saveState(); renderNav(); renderContent(); applyTheme();
      toast("Playbook imported successfully");
    }catch(err){ toast("Import failed — invalid file"); }
  };
  reader.readAsText(file);
  e.target.value = "";
});

document.addEventListener("keydown",(e)=>{
  const tag = document.activeElement.tagName;
  const typing = tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT";
  if(e.key==="Escape"){ closeModal(); return; }
  if(typing) return;
  if(e.key==="/"){ e.preventDefault(); searchInput.focus(); }
  else if(e.key.toLowerCase()==="t"){ document.getElementById("themeBtn").click(); }
  else if(e.key==="?"){ openHelpModal(); }
  else if(e.key.toLowerCase()==="k" && e.shiftKey){ openShortcutsModal(); }
  else if(e.key.toLowerCase()==="n"){ navigate("cat-custom"); setTimeout(()=>document.getElementById("newWorkflowBtn")?.click(), 80); }
});

/* =====================================================================
   INIT
   ===================================================================== */
applyTheme();
renderNav();
renderContent();
if(!state.onboardingDone){ setTimeout(runOnboarding, 400); }
</script>
</body>
</html>
