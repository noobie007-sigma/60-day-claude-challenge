<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Studio — Code Edition</title>
<style>
:root{
  --bg:#1a1b26;
  --bg-elevated:#20222f;
  --bg-tab:#16171f;
  --gutter:#3b3d52;
  --text:#c8ccdb;
  --text-dim:#6b7089;
  --text-faint:#4a4d63;
  --accent:#b48ead;      /* mauve */
  --accent2:#7dcfa5;     /* mint */
  --keyword:#7aa2f7;     /* blue */
  --string:#9ece6a;      /* green */
  --func:#e0af68;        /* amber */
  --error:#f7768e;       /* rose */
  --caret:#e0af68;
  --border:#2a2d3e;
  --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  --radius:10px;
  --font-mono: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-ui: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --fs-scale:1;
}
[data-theme="light"]{
  --bg:#f4f4f8;
  --bg-elevated:#ffffff;
  --bg-tab:#eceef4;
  --gutter:#d3d6e2;
  --text:#2b2d3a;
  --text-dim:#767a90;
  --text-faint:#a8acbe;
  --accent:#8c5e83;
  --accent2:#2f9e6f;
  --keyword:#3a5fd9;
  --string:#3a8f3a;
  --func:#b3760a;
  --error:#d2405a;
  --caret:#b3760a;
  --border:#dfe1ec;
  --shadow: 0 20px 50px -20px rgba(30,30,60,0.15);
}
[data-theme="contrast"]{
  --bg:#000000;
  --bg-elevated:#0a0a0a;
  --bg-tab:#000000;
  --gutter:#555555;
  --text:#ffffff;
  --text-dim:#aaaaaa;
  --text-faint:#777777;
  --accent:#ffdd55;
  --accent2:#55ff99;
  --keyword:#66aaff;
  --string:#88ff88;
  --func:#ffcc66;
  --error:#ff6688;
  --caret:#ffdd55;
  --border:#333333;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 800px at 80% -10%, rgba(122,162,247,0.08), transparent 60%), var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  min-height:100vh;
  font-size:calc(15px * var(--fs-scale));
  transition:background .3s ease, color .3s ease;
}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent);color:#000;padding:8px 14px;border-radius:6px;z-index:999;}
.skip-link:focus{left:12px;top:12px;}

/* ============ TOP CHROME: editor window bar ============ */
.app-shell{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
.editor-window{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.window-bar{
  display:flex;align-items:center;gap:10px;
  padding:11px 16px;
  background:var(--bg-tab);
  border-bottom:1px solid var(--border);
}
.dots{display:flex;gap:7px;}
.dot{width:11px;height:11px;border-radius:50%;}
.dot.r{background:#f7768e;} .dot.y{background:#e0af68;} .dot.g{background:#9ece6a;}
.window-title{
  flex:1;text-align:center;font-size:12.5px;color:var(--text-dim);
  font-family:var(--font-mono); letter-spacing:.3px;
}
.brand{
  display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--accent);
}
.brand .cursor-blink{display:inline-block;width:7px;height:14px;background:var(--accent);animation:blink 1.1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* tab bar for language/mode selection */
.tab-bar{display:flex;align-items:stretch;background:var(--bg-tab);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;}
.tab-bar::-webkit-scrollbar{height:5px;}
.tab-bar::-webkit-scrollbar-thumb{background:var(--gutter);border-radius:4px;}
.file-tab{
  display:flex;align-items:center;gap:7px;padding:10px 16px;font-family:var(--font-mono);font-size:12.5px;
  color:var(--text-dim);border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;
  background:transparent; transition:background .15s, color .15s;
}
.file-tab:hover{color:var(--text);background:rgba(255,255,255,0.03);}
.file-tab.active{color:var(--text);background:var(--bg-elevated);border-bottom:2px solid var(--accent);}
.file-tab .dotfile{width:6px;height:6px;border-radius:50%;background:var(--func);}

/* ============ control bar ============ */
.controls{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);
}
.control-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.pill-group{display:flex;background:var(--bg-tab);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;}
.pill{
  padding:6px 12px;font-size:12.5px;border-radius:6px;color:var(--text-dim);cursor:pointer;
  font-family:var(--font-mono);border:none;background:transparent;transition:all .15s;
}
.pill:hover{color:var(--text);}
.pill.active{background:var(--accent);color:#141420;font-weight:700;}
select.pill{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);background-position:calc(100% - 12px) center, calc(100% - 8px) center;background-size:4px 4px;background-repeat:no-repeat;}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg-tab);
  color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:all .15s;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent);}
.icon-btn.active{color:var(--accent);border-color:var(--accent);}

/* ============ stats strip (status bar look) ============ */
.stats-strip{
  display:grid;grid-template-columns:repeat(6,1fr);gap:0;
  border-bottom:1px solid var(--border);background:var(--bg-tab);
}
.stat-cell{
  padding:12px 8px;text-align:center;border-right:1px solid var(--border);
}
.stat-cell:last-child{border-right:none;}
.stat-val{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--text);line-height:1.1;}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--text-faint);margin-top:3px;}
.stat-cell.hot .stat-val{color:var(--accent);}

/* ============ typing area ============ */
.editor-body{position:relative;padding:0;}
.progress-track{height:3px;background:var(--border);position:relative;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--keyword),var(--accent));width:0%;transition:width .15s linear;}

.code-frame{display:flex;padding:26px 0 34px;}
.gutter{
  font-family:var(--font-mono);color:var(--text-faint);font-size:calc(16px * var(--fs-scale));
  text-align:right;padding:0 14px 0 22px;user-select:none;line-height:1.9;min-width:44px;
}
.text-display{
  flex:1;font-family:var(--font-mono);font-size:calc(16px * var(--fs-scale));line-height:1.9;
  padding:0 28px 0 4px;letter-spacing:.2px;position:relative;
  outline:none; white-space:pre-wrap; word-break:break-word;
}
.text-display.zen-mode{font-size:calc(20px * var(--fs-scale));}
.ch{position:relative;}
.ch.correct{color:var(--string);}
.ch.incorrect{color:var(--error);background:rgba(247,118,142,0.14);border-radius:2px;}
.ch.incorrect.space-err{background:rgba(247,118,142,0.28);}
.ch.pending{color:var(--text-dim);}
.ch.extra{color:var(--error);text-decoration:underline;text-decoration-color:var(--error);opacity:.8;}
.ch.cursor::before{
  content:'';position:absolute;left:-1px;top:-2px;bottom:-2px;width:2px;background:var(--caret);
  animation:caret-blink 1s step-end infinite;
}
@keyframes caret-blink{50%{opacity:.2;}}
.line-hidden{display:none;}
.text-display.focus-mode .fx-line{opacity:.15;filter:blur(1.5px);}
.text-display.focus-mode .fx-line.fx-active{opacity:1;filter:none;}

.hint-row{display:flex;justify-content:space-between;align-items:center;padding:0 24px 18px;color:var(--text-faint);font-size:12px;font-family:var(--font-mono);}
.kbd{display:inline-block;background:var(--bg-tab);border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin:0 2px;color:var(--text-dim);}

.overlay-msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:rgba(10,10,16,0.72);backdrop-filter:blur(3px);z-index:5;border-radius:0;
}
[data-theme="light"] .overlay-msg{background:rgba(255,255,255,0.85);}
.overlay-msg h3{font-family:var(--font-mono);font-size:19px;margin:0;color:var(--accent);}
.overlay-msg p{color:var(--text-dim);margin:0;font-size:13px;}
.overlay-btn{padding:10px 22px;border-radius:8px;background:var(--accent);border:none;color:#141420;font-weight:700;cursor:pointer;font-family:var(--font-mono);font-size:13px;}

/* custom text input */
.custom-box{display:none;padding:18px 24px;border-bottom:1px solid var(--border);}
.custom-box.show{display:block;}
.custom-box textarea{
  width:100%;min-height:90px;background:var(--bg-tab);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:var(--font-mono);font-size:13.5px;padding:12px;resize:vertical;
}
.custom-box button{margin-top:8px;padding:8px 16px;border-radius:7px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:var(--font-mono);font-weight:600;}

footer.actions{display:flex;gap:10px;justify-content:center;padding:20px;flex-wrap:wrap;}
.btn{
  padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--bg-tab);
  color:var(--text);cursor:pointer;font-family:var(--font-mono);font-size:13px;font-weight:600;transition:all .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#141420;border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.08);color:#141420;}

/* ============ dashboard ============ */
.dashboard{max-width:1180px;margin:26px auto 0;display:none;}
.dashboard.show{display:block;animation:fadein .4s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.dash-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;padding:0 4px;flex-wrap:wrap;gap:8px;}
.dash-header h2{font-family:var(--font-mono);margin:0;font-size:20px;}
.dash-header h2 .accent{color:var(--accent);}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.badge{
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;
  background:linear-gradient(135deg, rgba(180,142,173,0.18), rgba(122,162,247,0.12));
  border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);
}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
.grid.g3{grid-template-columns:repeat(3,1fr);}
.grid.g2{grid-template-columns:repeat(2,1fr);}
.card{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
}
.card .big{font-family:var(--font-mono);font-size:30px;font-weight:800;color:var(--text);}
.card .lbl{font-size:11px;text-transform:uppercase;color:var(--text-faint);letter-spacing:.8px;margin-top:2px;}
.card .sub{font-size:11.5px;color:var(--text-dim);margin-top:6px;}
.card.hi .big{color:var(--accent2);}
.card canvas{width:100%;display:block;}
.card h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);font-weight:700;}

.heatmap-keys{display:flex;flex-wrap:wrap;gap:5px;}
.hk{font-family:var(--font-mono);font-size:11px;padding:5px 8px;border-radius:5px;background:var(--bg-tab);color:var(--text-dim);border:1px solid var(--border);}

.summary-box p{font-size:13px;line-height:1.7;color:var(--text-dim);margin:0 0 8px;}
.summary-box strong{color:var(--text);}

.history-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12.5px;}
.history-table th{text-align:left;color:var(--text-faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;}
.history-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-dim);}
.history-table tr:hover td{color:var(--text);background:rgba(255,255,255,0.02);}
.history-table td.pb{color:var(--func);font-weight:700;}

.settings-panel{
  position:fixed;top:0;right:-360px;width:340px;height:100%;background:var(--bg-elevated);
  border-left:1px solid var(--border);box-shadow:-20px 0 50px rgba(0,0,0,0.3);z-index:50;
  padding:22px;transition:right .3s ease;overflow-y:auto;
}
.settings-panel.open{right:0;}
.settings-panel h3{font-family:var(--font-mono);margin-top:0;}
.settings-row{margin-bottom:18px;}
.settings-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px;}
.theme-swatches{display:flex;gap:8px;}
.swatch{width:38px;height:38px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.swatch.active{border-color:var(--accent);}
.swatch.dark{background:#1a1b26;}
.swatch.light{background:#f4f4f8;border:2px solid #ddd;}
.swatch.contrast{background:#000;}
.close-panel{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:49;}
.settings-overlay.show{display:block;}
input[type=range]{width:100%;accent-color:var(--accent);}
.range-val{font-family:var(--font-mono);color:var(--accent);font-size:12px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg-elevated);border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:8px;
  font-family:var(--font-mono);font-size:12.5px;opacity:0;transition:all .3s ease;z-index:60;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:820px){
  .stats-strip{grid-template-columns:repeat(3,1fr);}
  .stat-cell:nth-child(3){border-right:none;}
  .grid, .grid.g3{grid-template-columns:repeat(2,1fr);}
  .gutter{display:none;}
  .settings-panel{width:88%;right:-90%;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important;}
}
</style>
</head>

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function wordsToLength(n){
  const pool = GENERAL_WORDS;
  let out=[];
  for(let i=0;i<n;i++) out.push(pool[Math.floor(Math.random()*pool.length)]);
  return out.join(" ");
}

function generateText(){
  let txt = "";
  if(state.mode==="quote"){
    txt = pick(QUOTES);
  } else if(state.mode==="programming"){
    txt = pick(SNIPPETS[state.language] || SNIPPETS.python);
  } else if(state.mode==="adaptive"){
    // adjust difficulty: level 1 = words, level 2 = quote, level3+ = code snippet
    if(state.adaptiveLevel<=1) txt = wordsToLength(30);
    else if(state.adaptiveLevel===2) txt = pick(QUOTES);
    else txt = pick(SNIPPETS[state.language] || SNIPPETS.python);
  } else if(state.mode==="custom"){
    txt = state._customText || "Click 'Load custom text' above after pasting your own text or code to practice with.";
  } else if(state.mode==="words"){
    txt = wordsToLength(state.wordOption);
  } else if(state.mode==="zen"){
    txt = pick(SNIPPETS[state.language] || SNIPPETS.python) + "\n\n" + wordsToLength(20);
  } else { // time mode -> generate generous programming/word mixture depending on tab active
    txt = (Math.random()<0.5 ? pick(SNIPPETS[state.language]||SNIPPETS.python) + "\n" + wordsToLength(40) : wordsToLength(60));
  }
  return txt;
}

function buildChars(text){
  return text.split("").map(ch=>({ch, status:"pending"}));
}

function render(){
  textDisplay.innerHTML = "";
  gutter.innerHTML = "";
  let lineNum = 1;
  gutter.appendChild(document.createTextNode(""));
  let lineDiv = document.createElement("span");
  lineDiv.className = "fx-line fx-active";
  let lineCount = 1;
  const lineNums = [1];

  state.chars.forEach((c,i)=>{
    const span = document.createElement("span");
    span.className = "ch " + c.status;
    if(i===state.pos) span.classList.add("cursor");
    span.textContent = c.ch === "\n" ? "\n" : c.ch;
    lineDiv.appendChild(span);
    if(c.ch === "\n"){
      textDisplay.appendChild(lineDiv);
      lineNum++;
      lineNums.push(lineNum);
      lineDiv = document.createElement("span");
      lineDiv.className = "fx-line";
    }
  });
  textDisplay.appendChild(lineDiv);

  // gutter line numbers
  gutter.innerHTML = lineNums.map(n=>`<div>${n}</div>`).join("");

  // focus mode: mark active line based on cursor position
  if(state.focusMode){
    textDisplay.classList.add("focus-mode");
    markActiveLine();
  } else {
    textDisplay.classList.remove("focus-mode");
  }
  if(state.zenMode) textDisplay.classList.add("zen-mode"); else textDisplay.classList.remove("zen-mode");
}

function markActiveLine(){
  const lines = textDisplay.querySelectorAll(".fx-line");
  let count=0;
  let idx=0;
  for(let i=0;i<state.chars.length;i++){
    if(i===state.pos){ break; }
    if(state.chars[i].ch==="\n") idx++;
  }
  lines.forEach((l,i)=> l.classList.toggle("fx-active", i===idx));
}

/* =====================================================================
   TIMER & STATS
===================================================================== */
function fmtTime(s){ return s.toFixed(1)+"s"; }

function updateStats(){
  const now = Date.now();
  state.elapsed = state.started ? (now - state.startTime)/1000 : 0;
  const minutes = Math.max(state.elapsed/60, 1/600); // avoid divide by ~0, floor at 0.1s
  const correctChars = state.chars.filter(c=>c.status==="correct").length;
  const grossWords = state.totalKeystrokes/5;
  const netWords = correctChars/5;
  const rawWpm = state.elapsed>0.15 ? Math.min(grossWords/minutes, 400) : 0;
  const wpm = state.elapsed>0.15 ? Math.min(netWords/minutes, 400) : 0;
  const acc = state.totalKeystrokes>0 ? Math.max(0,Math.min(100,(state.correctKeystrokes/state.totalKeystrokes)*100)) : 100;

  $("statWpm").textContent = Math.round(wpm);
  $("statRaw").textContent = Math.round(rawWpm);
  $("statAcc").textContent = acc.toFixed(0)+"%";
  $("statTime").textContent = fmtTime(state.elapsed);
  $("statMistakes").textContent = state.mistakes;
  $("statStreak").textContent = state.streak;

  const total = state.chars.length || 1;
  const pct = Math.min(100,(state.pos/total)*100);
  progressFill.style.width = pct+"%";

  if(state.started && !state.finished){
    state.wpmSamples.push({t: state.elapsed, wpm: Math.round(wpm), raw: Math.round(rawWpm), acc: Math.round(acc)});
  }
}

function tick(){
  if(state.paused || state.finished) return;
  updateStats();
  if(state.mode==="time"){
    const remaining = state.timeOption - state.elapsed;
    if(remaining<=0){ finishTest(); return; }
  }
}

/* =====================================================================
   INPUT HANDLING
===================================================================== */
function startTimerIfNeeded(){
  if(!state.started){
    state.started = true;
    state.startTime = Date.now();
    state.timerId = setInterval(tick, 100);
  }
}

function handleChar(inputCh){
  if(state.finished) return;
  startTimerIfNeeded();
  if(state.paused) return;

  const expected = state.chars[state.pos];
  if(!expected){
    // extra char scenario (shouldn't happen since we stop at end) - ignore
    return;
  }
  state.totalKeystrokes++;

  if(inputCh === expected.ch){
    expected.status = "correct";
    state.correctKeystrokes++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    beep(720,0.02,0.02);
  } else {
    expected.status = "incorrect";
    state.mistakes++;
    state.streak = 0;
    state.errorPositions.push(state.pos);
    const key = expected.ch === " " ? "[space]" : expected.ch;
    state.keyErrors[key] = (state.keyErrors[key]||0)+1;
    beep(180,0.05,0.035);
  }
  state.pos++;
  render();
  updateStats();

  const total = state.chars.length;
  if(state.mode==="words" && state.pos>=total){ finishTest(); return; }
  if(state.mode!=="time" && state.mode!=="zen" && state.pos>=total){ finishTest(); return; }
  if(state.pos>=total && state.mode==="zen"){ /* zen: load more text seamlessly */
    appendMoreZenText();
  }
}

function handleBackspace(){
  if(state.pos>0 && !state.finished){
    state.pos--;
    state.chars[state.pos].status = "pending";
    render();
    updateStats();
  }
}

function appendMoreZenText(){
  const more = generateText();
  const moreChars = buildChars("\n\n"+more);
  state.chars = state.chars.concat(moreChars);
  render();
}

textDisplay.addEventListener("keydown", e=>{
  if(state.finished) return;
  if(e.key==="Escape"){ togglePause(); e.preventDefault(); return; }
  if(e.key==="Backspace"){ handleBackspace(); e.preventDefault(); return; }
  if(e.key==="Tab"){ e.preventDefault(); return; }
  if(e.key.length===1){
    handleChar(e.key);
    e.preventDefault();
  } else if(e.key==="Enter"){
    handleChar("\n");
    e.preventDefault();
  }
});
textDisplay.addEventListener("click", ()=>{ textDisplay.focus(); });

document.addEventListener("keydown", e=>{
  if(document.activeElement===textDisplay) return;
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(e.key==="f"||e.key==="F"){ toggleFocus(); }
  if(e.key==="z"||e.key==="Z"){ toggleZen(); }
  if(e.key==="Tab"){ e.preventDefault(); textDisplay.focus(); }
});

/* =====================================================================
   FINISH -> DASHBOARD
===================================================================== */
function computeConsistency(){
  const samples = state.wpmSamples.map(s=>s.wpm).filter(v=>v>0);
  if(samples.length<2) return 100;
  const mean = samples.reduce((a,b)=>a+b,0)/samples.length;
  const variance = samples.reduce((a,b)=>a+Math.pow(b-mean,2),0)/samples.length;
  const sd = Math.sqrt(variance);
  const cv = mean>0 ? sd/mean : 0;
  return Math.max(0, Math.min(100, Math.round((1-cv)*100)));
}

function loadHistory(){
  try{ return JSON.parse(localStorage.getItem("tss_history")||"[]"); }catch(e){ return []; }
}
function saveHistory(list){ localStorage.setItem("tss_history", JSON.stringify(list.slice(-200))); }

function finishTest(){
  if(state.finished) return;
  state.finished = true;
  clearInterval(state.timerId);
  updateStats();
  beep(500,0.08,0.04); setTimeout(()=>beep(700,0.1,0.04),90); setTimeout(()=>beep(900,0.14,0.04),180);

  const correctChars = state.chars.filter(c=>c.status==="correct").length;
  const incorrectChars = state.chars.filter(c=>c.status==="incorrect").length;
  const missedChars = state.chars.filter(c=>c.status==="pending").length;
  const minutes = Math.max(state.elapsed/60, 1/600);
  const wpm = Math.round(Math.min((correctChars/5)/minutes, 400));
  const rawWpm = Math.round(Math.min((state.totalKeystrokes/5)/minutes,400));
  const acc = state.totalKeystrokes>0 ? Math.round((state.correctKeystrokes/state.totalKeystrokes)*100) : 100;
  const consistency = computeConsistency();
  const completion = Math.round((state.pos/state.chars.length)*100);

  const session = {
    date: new Date().toISOString(),
    mode: state.mode,
    language: state.language,
    wpm, rawWpm, acc, consistency, completion,
    correctChars, incorrectChars, missedChars,
    mistakes: state.mistakes,
    duration: state.elapsed,
    bestStreak: state.bestStreak,
    keyErrors: state.keyErrors,
    wpmSamples: state.wpmSamples
  };

  const history = loadHistory();
  history.push(session);
  saveHistory(history);

  // adaptive: adjust level based on performance
  if(state.mode==="adaptive"){
    if(acc>95 && wpm>45) state.adaptiveLevel = Math.min(4, state.adaptiveLevel+1);
    else if(acc<85 || wpm<20) state.adaptiveLevel = Math.max(1, state.adaptiveLevel-1);
  }

  renderDashboard(session, history);
  toast("Session complete — dashboard ready");
}

===================================================================== */
function personalBests(history, mode){
  const relevant = history.filter(h=>h.mode===mode);
  if(relevant.length===0) return null;
  return relevant.reduce((best,h)=> h.wpm>best.wpm ? h : best, relevant[0]);
}

function percentileEstimate(wpm){
  // rough distribution model of typing speed population
  if(wpm<20) return 10;
  if(wpm<30) return 25;
  if(wpm<40) return 40;
  if(wpm<50) return 55;
  if(wpm<60) return 68;
  if(wpm<70) return 78;
  if(wpm<80) return 86;
  if(wpm<90) return 92;
  if(wpm<100) return 96;
  if(wpm<120) return 99;
  return 99.5;
}

function drawLineChart(canvas, seriesArr, colors, labels){
  const ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.clientWidth * 2;
  const h = canvas.height = 140*2;
  ctx.clearRect(0,0,w,h);
  ctx.scale(1,1);
  const pad = 20*2;
  let maxV = 10;
  seriesArr.forEach(s=> s.forEach(v=> maxV = Math.max(maxV, v)));
  maxV = Math.ceil(maxV*1.15);

  // grid lines
  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const y = pad + (h-pad*2)*(i/3);
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad/2,y); ctx.stroke();
  }

  seriesArr.forEach((series, si)=>{
    if(series.length<2) return;
    ctx.strokeStyle = colors[si];
    ctx.lineWidth = 3;
    ctx.beginPath();
    series.forEach((v,i)=>{
      const x = pad + (w-pad-pad/2)*(i/(series.length-1));
      const y = h-pad - (h-pad*2)*(v/maxV);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    // fill under last (main) series
    if(si===0){
      ctx.lineTo(pad + (w-pad-pad/2), h-pad);
      ctx.lineTo(pad, h-pad);
      ctx.closePath();
      ctx.fillStyle = colors[si].replace(")", ",0.08)").replace("rgb","rgba");
      ctx.fill();
    }
  });
}

function buildSummary(session, history){
  const strengths=[], weaknesses=[], suggestions=[];
  if(session.acc>=97) strengths.push("excellent accuracy");
  else if(session.acc<88) weaknesses.push("accuracy dipped below 88%");
  if(session.wpm>=70) strengths.push("fast typing speed");
  else if(session.wpm<30) weaknesses.push("typing speed is below average");
  if(session.consistency>=80) strengths.push("very consistent rhythm");
  else if(session.consistency<55) weaknesses.push("rhythm was inconsistent, with speed bursts and slowdowns");

  const topErrKeys = Object.entries(session.keyErrors).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  if(topErrKeys.length){
    weaknesses.push(`frequent mistakes on "${topErrKeys.join('", "')}"`);
    suggestions.push(`Slow down slightly around ${topErrKeys.join(", ")} — targeted drills on these characters should help.`);
  }
  if(session.consistency<55) suggestions.push("Try Zen mode to build a steadier rhythm without time pressure.");
  if(session.acc<90) suggestions.push("Prioritize accuracy over speed for a few sessions — WPM will follow naturally.");
  if(session.wpm<30 && session.acc>95) suggestions.push("Your accuracy is strong — focus next on reducing hesitation between words to raise speed.");
  if(strengths.length===0) strengths.push("steady completion of the passage");
  if(suggestions.length===0) suggestions.push("Keep practicing in Adaptive mode to gradually raise difficulty.");

  return {strengths, weaknesses, suggestions};
}

function renderDashboard(session, history){
  const dash = $("dashboard");
  const modeHistory = history.filter(h=>h.mode===session.mode);
  const pb = personalBests(history, session.mode);
  const isPB = pb && pb.wpm===session.wpm && pb.date===session.date;
  const percentile = percentileEstimate(session.wpm);
  const summary = buildSummary(session, history);

  const badges = [];
  if(session.acc===100) badges.push("💯 Flawless Accuracy");
  if(session.wpm>=80) badges.push("⚡ Speed Demon");
  if(session.consistency>=90) badges.push("🎯 Metronome");
  if(isPB) badges.push("🏆 New Personal Best");
  if(session.bestStreak>=50) badges.push("🔥 "+session.bestStreak+" Streak");
  if(modeHistory.length>=10) badges.push("📈 10+ Sessions");
  if(badges.length===0) badges.push("✅ Session Complete");

  dash.innerHTML = `
    <div class="dash-header">
      <h2>Session <span class="accent">Analytics</span></h2>
      <div style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">${session.mode.toUpperCase()} · ${new Date(session.date).toLocaleString()}</div>
    </div>
    <div class="badge-row">${badges.map(b=>`<div class="badge">${b}</div>`).join("")}</div>

    <div class="grid" style="margin-top:16px;">
      <div class="card hi"><div class="big">${session.wpm}</div><div class="lbl">WPM</div><div class="sub">Net words per minute</div></div>
      <div class="card"><div class="big">${session.rawWpm}</div><div class="lbl">Raw WPM</div><div class="sub">Including errors</div></div>
      <div class="card"><div class="big">${session.acc}%</div><div class="lbl">Accuracy</div><div class="sub">${session.mistakes} mistakes</div></div>
      <div class="card"><div class="big">${session.consistency}%</div><div class="lbl">Consistency</div><div class="sub">Rhythm stability</div></div>
    </div>
    <div class="grid">
      <div class="card"><div class="big">${session.completion}%</div><div class="lbl">Completion</div></div>
      <div class="card"><div class="big">${session.duration.toFixed(1)}s</div><div class="lbl">Duration</div></div>
      <div class="card"><div class="big">${session.bestStreak}</div><div class="lbl">Best Streak</div></div>
      <div class="card"><div class="big">${percentile}<span style="font-size:16px;">th</span></div><div class="lbl">Percentile Est.</div></div>
    </div>

    <div class="grid g2">
      <div class="card">
        <h4>WPM Progress</h4>
        <canvas id="wpmChart" height="140"></canvas>
      </div>
      <div class="card">
        <h4>Accuracy Over Time</h4>
        <canvas id="accChart" height="140"></canvas>
      </div>
    </div>

    <div class="grid g3">
      <div class="card">
        <h4>Characters</h4>
        <div class="sub" style="font-size:13px;line-height:2;">
          <span style="color:var(--string);">Correct: ${session.correctChars}</span><br>
          <span style="color:var(--error);">Incorrect: ${session.incorrectChars}</span><br>
          <span style="color:var(--text-dim);">Missed: ${session.missedChars}</span>
        </div>
      </div>
      <div class="card">
        <h4>Error Heatmap</h4>
        <div class="heatmap-keys">${Object.entries(session.keyErrors).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<span class="hk">${k==='\n'?'⏎':k} ×${v}</span>`).join("") || '<span class="hk">No errors 🎉</span>'}</div>
      </div>
      <div class="card">
        <h4>Personal Best (${session.mode})</h4>
        ${pb ? `<div class="big" style="font-size:24px;">${pb.wpm} WPM</div><div class="sub">${pb.acc}% acc · ${new Date(pb.date).toLocaleDateString()}</div>` : `<div class="sub">First session in this mode!</div>`}
      </div>
    </div>

    <div class="card summary-box" style="margin-bottom:14px;">
      <h4>Performance Summary</h4>
      <p><strong>Strengths:</strong> ${summary.strengths.join(", ")}.</p>
      ${summary.weaknesses.length? `<p><strong>Watch for:</strong> ${summary.weaknesses.join("; ")}.</p>`:""}
      <p><strong>Suggestions:</strong> ${summary.suggestions.join(" ")}</p>
    </div>

    <footer class="actions">
      <button class="btn primary" id="dashRetry">↻ Try Again</button>
      <button class="btn" id="dashHistory">📊 View Full History</button>
    </footer>
  `;
  dash.classList.add("show");
  dash.scrollIntoView({behavior:"smooth", block:"start"});

  const wpmSeries = session.wpmSamples.map(s=>s.wpm);
  const accSeries = session.wpmSamples.map(s=>s.acc);
  requestAnimationFrame(()=>{
    drawLineChart($("wpmChart"), [wpmSeries.length?wpmSeries:[0,session.wpm]], ["rgb(180,142,173)"]);
    drawLineChart($("accChart"), [accSeries.length?accSeries:[100,session.acc]], ["rgb(125,207,165)"]);
  });

  $("dashRetry").addEventListener("click", newTest);
  $("dashHistory").addEventListener("click", ()=>{ renderHistoryPanel(); $("historyPanel").scrollIntoView({behavior:"smooth"}); });
}

function renderHistoryPanel(){
  const history = loadHistory().slice().reverse().slice(0,50);
  const panel = $("historyPanel");
  const bestOverall = {};
  loadHistory().forEach(h=>{ if(!bestOverall[h.mode] || h.wpm>bestOverall[h.mode].wpm) bestOverall[h.mode]=h; });

  panel.innerHTML = `
    <div class="dash-header"><h2>Session <span class="accent">History</span></h2><div style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">${loadHistory().length} sessions recorded</div></div>
    <div class="card">
      <table class="history-table">
        <thead><tr><th>Date</th><th>Mode</th><th>WPM</th><th>Raw</th><th>Acc</th><th>Consistency</th><th>Mistakes</th></tr></thead>
        <tbody>
          ${history.map(h=>`<tr>
            <td>${new Date(h.date).toLocaleString()}</td>
            <td>${h.mode}${h.language && (h.mode==='programming'||h.mode==='adaptive') ? ' · '+h.language:''}</td>
            <td class="${bestOverall[h.mode] && bestOverall[h.mode].date===h.date ? 'pb':''}">${h.wpm}</td>
            <td>${h.rawWpm}</td>
            <td>${h.acc}%</td>
            <td>${h.consistency}%</td>
            <td>${h.mistakes}</td>
          </tr>`).join("") || `<tr><td colspan="7">No sessions yet — finish a test to see it here.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  panel.classList.add("show");
}
$("historyBtn").addEventListener("click", ()=>{
  renderHistoryPanel();
  $("historyPanel").scrollIntoView({behavior:"smooth"});
});

/* =====================================================================
   FOCUS / ZEN TOGGLES
===================================================================== */
function toggleFocus(){
  state.focusMode = !state.focusMode;
  $("focusToggle").classList.toggle("active", state.focusMode);
  $("focusToggle").setAttribute("aria-pressed", state.focusMode);
  render();
}
function toggleZen(){
  selectMode(state.zenMode ? "time" : "zen");
  $("zenToggle").classList.toggle("active", state.zenMode);
}
$("focusToggle").addEventListener("click", toggleFocus);
$("zenToggle").addEventListener("click", toggleZen);

/* =====================================================================
   SETTINGS PANEL
===================================================================== */
const settingsPanel = $("settingsPanel"), settingsOverlay = $("settingsOverlay");
$("settingsBtn").addEventListener("click", ()=>{ settingsPanel.classList.add("open"); settingsOverlay.classList.add("show"); renderPB(); });
$("closeSettings").addEventListener("click", closeSettings);
settingsOverlay.addEventListener("click", closeSettings);
function closeSettings(){ settingsPanel.classList.remove("open"); settingsOverlay.classList.remove("show"); }

document.querySelectorAll(".swatch").forEach(sw=>{
  sw.addEventListener("click", ()=>{
    document.body.setAttribute("data-theme", sw.dataset.theme);
    document.querySelectorAll(".swatch").forEach(s=>s.classList.remove("active"));
    sw.classList.add("active");
    localStorage.setItem("tss_theme", sw.dataset.theme);
  });
});
const savedTheme = localStorage.getItem("tss_theme");
if(savedTheme){ document.body.setAttribute("data-theme", savedTheme); document.querySelectorAll(".swatch").forEach(s=>s.classList.toggle("active", s.dataset.theme===savedTheme)); }

$("fontSizeRange").addEventListener("input", e=>{
  const val = e.target.value;
  document.documentElement.style.setProperty("--fs-scale", val/100);
  $("fontSizeVal").textContent = val+"%";
});

$("soundOn").addEventListener("click", ()=>{ state.soundOn=true; $("soundOn").classList.add("active"); $("soundOff").classList.remove("active"); $("soundToggle").textContent="🔊"; });
$("soundOff").addEventListener("click", ()=>{ state.soundOn=false; $("soundOff").classList.add("active"); $("soundOn").classList.remove("active"); $("soundToggle").textContent="🔇"; });
$("soundToggle").addEventListener("click", ()=>{ state.soundOn=!state.soundOn; $("soundToggle").textContent = state.soundOn?"🔊":"🔇"; $("soundOn").classList.toggle("active",state.soundOn); $("soundOff").classList.toggle("active",!state.soundOn); });

document.querySelectorAll("#caretStyleGroup .pill").forEach(p=>{
  p.addEventListener("click", ()=>{
    document.querySelectorAll("#caretStyleGroup .pill").forEach(x=>x.classList.remove("active"));
    p.classList.add("active");
    toast("Caret style: "+p.dataset.caret);
  });
});

$("clearHistoryBtn").addEventListener("click", ()=>{
  if(confirm("Clear all locally stored session history? This cannot be undone.")){
    localStorage.removeItem("tss_history");
    toast("History cleared");
    renderPB();
  }
});

function renderPB(){
  const history = loadHistory();
  const modes = ["time","words","quote","programming","custom","adaptive","zen"];
  const lines = modes.map(m=>{
    const best = personalBests(history,m);
    return best ? `${m}: <strong style="color:var(--func)">${best.wpm} WPM</strong>` : `${m}: —`;
  });
  $("pbSummary").innerHTML = lines.join("<br>");
}

/* =====================================================================
   CUSTOM TEXT
===================================================================== */
$("applyCustom").addEventListener("click", ()=>{
  const val = $("customText").value.trim();
  if(!val){ toast("Paste some text first"); return; }
  state._customText = val;
  newTest();
  toast("Custom text loaded");
});

/* =====================================================================
   INIT
===================================================================== */
renderSubOptions();
newTest();
renderPB();

})();
</script>
