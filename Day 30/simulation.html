<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supply Chain Builder</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg-0:#0b0e14;
    --bg-1:#11141c;
    --bg-2:#171b26;
    --bg-3:#1e2330;
    --border:#2a3040;
    --accent:#5b8cff;
    --accent-2:#7ee0c1;
    --warn:#ffb454;
    --danger:#ff6b6b;
    --good:#7ee0c1;
    --text-0:#f2f4f8;
    --text-1:#c3c9d6;
    --text-2:#868faa;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #16203a 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, #1a1530 0%, transparent 55%),
      var(--bg-0);
    color:var(--text-0);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  #root{min-height:100vh;}
  .app{
    max-width:1200px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.3px;
  }
  .brand-badge{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    box-shadow:0 6px 16px rgba(91,140,255,0.35);
  }
  .progress-track{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .progress-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--bg-3);
    border:1px solid var(--border);
    transition:all .35s ease;
  }
  .progress-dot.active{
    background:var(--accent);
    box-shadow:0 0 0 4px rgba(91,140,255,0.18);
  }
  .progress-dot.done{
    background:var(--good);
  }

  .card{
    background:linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border:1px solid var(--border);
    border-radius:18px;
    padding:26px;
    box-shadow:var(--shadow);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    animation: fadeInUp .45s ease;
  }
  .card:hover{
    border-color:#39415a;
  }
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .grid{
    display:grid;
    gap:22px;
  }
  @media(min-width:860px){
    .grid.two-col{
      grid-template-columns: 1.4fr 1fr;
      align-items:start;
    }
  }

  h1{font-size:30px;margin:0 0 10px;}
  h2{font-size:22px;margin:0 0 8px;}
  h3{font-size:17px;margin:0 0 6px;}
  p{color:var(--text-1); line-height:1.55; margin:0 0 12px;}
  .muted{color:var(--text-2); font-size:13px;}
  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--bg-3);
    border:1px solid var(--border);
    padding:5px 12px;
    border-radius:999px;
    font-size:12.5px;
    color:var(--text-1);
    margin:3px 6px 3px 0;
  }
  .btn{
    appearance:none;
    border:1px solid var(--border);
    background:var(--bg-3);
    color:var(--text-0);
    padding:12px 18px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition: transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .btn:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 8px 20px rgba(91,140,255,0.18);
  }
  .btn:active{transform:translateY(0);}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),#4169e1);
    border:none;
    color:white;
  }
  .btn-primary:hover{
    box-shadow:0 10px 24px rgba(91,140,255,0.4);
  }
  .btn-ghost{
    background:transparent;
  }
  .btn-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:18px;
  }

  .option-grid{
    display:grid;
    gap:14px;
    grid-template-columns:1fr;
  }
  @media(min-width:640px){
    .option-grid.cols-2{grid-template-columns:1fr 1fr;}
  }
  @media(min-width:860px){
    .option-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
    .option-grid.cols-4{grid-template-columns:repeat(4,1fr);}
  }
  .option-card{
    background:var(--bg-3);
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:18px;
    cursor:pointer;
    transition: all .2s ease;
    text-align:left;
  }
  .option-card:hover{
    border-color:var(--accent);
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(91,140,255,0.15);
  }
  .option-card .icon{font-size:26px; margin-bottom:8px; display:block;}
  .option-card h4{margin:0 0 6px; font-size:15.5px;}
  .option-card p{margin:0; font-size:13px; color:var(--text-2);}

  .explain-box{
    background:rgba(91,140,255,0.08);
    border:1px solid rgba(91,140,255,0.25);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .explain-box .label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--accent-2);
    font-weight:700;
    margin-bottom:6px;
  }

  .feedback-box{
    background:rgba(126,224,193,0.08);
    border:1px solid rgba(126,224,193,0.3);
    border-radius:14px;
    padding:16px 18px;
    margin-top:18px;
    animation: fadeInUp .4s ease;
  }
  .feedback-box .label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--good);
    font-weight:700;
    margin-bottom:6px;
  }

  .metric-row{
    margin-bottom:16px;
  }
  .metric-head{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
    color:var(--text-1);
  }
  .metric-head b{color:var(--text-0); font-size:13px;}
  .bar-track{
    height:9px;
    background:var(--bg-3);
    border-radius:999px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .bar-fill{
    height:100%;
    border-radius:999px;
    transition:width .8s cubic-bezier(.22,.9,.3,1);
  }

  .sidebar-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--text-2);
    margin-bottom:14px;
    font-weight:700;
  }

  .score-ring-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px 0 20px;
  }
  .score-num{
    font-size:52px;
    font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .score-label{
    color:var(--text-2);
    font-size:13px;
    letter-spacing:0.5px;
  }

  .dash-grid{
    display:grid;
    gap:20px;
    grid-template-columns:1fr;
  }
  @media(min-width:900px){
    .dash-grid{grid-template-columns: 1fr 1fr;}
  }
  .pill-good{color:var(--good); font-weight:700;}
  .pill-bad{color:var(--danger); font-weight:700;}
  .pill-warn{color:var(--warn); font-weight:700;}

  ul.clean{
    margin:0; padding-left:20px;
  }
  ul.clean li{
    margin-bottom:8px;
    color:var(--text-1);
    line-height:1.5;
  }

  .choice-summary{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .footer-note{
    text-align:center;
    color:var(--text-2);
    font-size:12.5px;
    margin-top:36px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ---------------------------------------------------------
   DATA: company generation
--------------------------------------------------------- */
const INDUSTRIES = [
  { name: "Athletic Footwear", products: ["running shoes", "training sneakers"], icon: "👟" },
  { name: "Specialty Coffee", products: ["roasted coffee beans", "cold brew cans"], icon: "☕" },
  { name: "Consumer Electronics", products: ["wireless earbuds", "smart home hubs"], icon: "🎧" },
  { name: "Organic Skincare", products: ["face serums", "natural soaps"], icon: "🧴" },
  { name: "Furniture", products: ["flat-pack desks", "modular sofas"], icon: "🛋️" },
  { name: "Craft Beverages", products: ["small-batch sodas", "kombucha bottles"], icon: "🥤" },
  { name: "Outdoor Gear", products: ["hiking backpacks", "camping tents"], icon: "🎒" },
  { name: "Toys & Games", products: ["building blocks", "board games"], icon: "🧩" },
];

const REGIONS = [
  ["USA", "Canada", "Mexico"],
  ["Germany", "France", "Italy", "Spain"],
  ["India", "Japan", "South Korea"],
  ["UK", "Ireland"],
  ["Brazil", "Argentina"],
  ["Australia", "New Zealand"],
];

const DEMAND_LEVELS = [
  { level: "Steady", desc: "predictable, consistent demand year-round" },
  { level: "Seasonal", desc: "large spikes around key seasons or holidays" },
  { level: "High-Growth", desc: "rapidly increasing demand as the company scales" },
];

function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function generateCompany(){
  const industry = randomFrom(INDUSTRIES);
  const countries = randomFrom(REGIONS);
  const demand = randomFrom(DEMAND_LEVELS);
  const names = ["Northline", "Vertex", "Bluepeak", "Cascade", "Horizon", "Meridian", "Solace", "Trueform", "Amberwood", "Everline"];
  const suffix = ["Co.", "Goods", "Supply Co.", "Industries", "Group", "& Co."];
  const companyName = `${randomFrom(names)} ${randomFrom(suffix)}`;
  return { companyName, industry, countries, demand };
}

/* ---------------------------------------------------------
   DATA: decision steps
--------------------------------------------------------- */
const DECISIONS = [
  {
    id: "suppliers",
    title: "Choose Your Supplier Strategy",
    concept: "A supplier is the company that provides the raw materials or parts you need to make your product. This is the very first link in your supply chain — before anything can be built or sold, it has to be sourced.",
    why: "Where you get your materials from affects how much you pay, how reliable your supply is, and how exposed you are to shocks like factory shutdowns or shipping delays.",
    options: [
      {
        id: "single",
        icon: "🎯",
        label: "Single Supplier",
        desc: "Work with one trusted supplier for all materials.",
        effects: { cost: -10, speed: 0, risk: 20, satisfaction: -5, sustainability: 0 },
        tradeoff: "A single supplier usually means better pricing (bulk discounts, simpler relationship) and easier quality control. But it's risky: if that one supplier has a problem — a strike, a natural disaster, a shortage — your entire production can stop. This is called 'supplier concentration risk.'"
      },
      {
        id: "multiple",
        icon: "🌐",
        label: "Multiple Suppliers",
        desc: "Spread sourcing across several suppliers.",
        effects: { cost: 10, speed: 5, risk: -20, satisfaction: 5, sustainability: 5 },
        tradeoff: "Using several suppliers costs more to manage and you lose some bulk-buying power, so prices rise slightly. In exchange, you gain resilience — if one supplier fails, others can cover the gap. This diversification is a classic risk-reduction strategy."
      }
    ]
  },
  {
    id: "factory",
    title: "Choose Your Factory Location",
    concept: "The factory is where your raw materials are turned into finished products. Its location determines labor costs, shipping distances, and how quickly you can respond to demand.",
    why: "Manufacturing close to your customers is faster but usually pricier. Manufacturing far away (often called 'offshoring') is cheaper on labor but adds shipping time, complexity, and risk.",
    options: [
      {
        id: "domestic",
        icon: "🏭",
        label: "Domestic",
        desc: "Manufacture in the same country you sell in.",
        effects: { cost: 20, speed: 20, risk: -10, satisfaction: 10, sustainability: 10 },
        tradeoff: "Domestic manufacturing costs more (higher labor and facility costs) but delivers products faster, is easier to inspect and control, and produces fewer emissions from long-distance shipping."
      },
      {
        id: "nearshore",
        icon: "🌉",
        label: "Nearshore",
        desc: "Manufacture in a nearby country.",
        effects: { cost: 5, speed: 10, risk: -5, satisfaction: 5, sustainability: 5 },
        tradeoff: "Nearshoring is a middle ground: moderately lower costs than domestic, still relatively fast shipping, and easier time-zone coordination than manufacturing on the other side of the world."
      },
      {
        id: "offshore",
        icon: "🚢",
        label: "Offshore",
        desc: "Manufacture in a distant, low-cost country.",
        effects: { cost: -20, speed: -20, risk: 15, satisfaction: -5, sustainability: -10 },
        tradeoff: "Offshoring dramatically cuts labor costs, which is why it's so popular — but it stretches your supply chain across oceans. That means longer lead times, more exposure to customs delays and geopolitical risk, and a bigger carbon footprint from shipping."
      }
    ]
  },
  {
    id: "warehouse",
    title: "Choose Your Warehouse Strategy",
    concept: "A warehouse is where finished goods are stored before they're shipped to customers or stores. Warehouse strategy is about how many warehouses you use and where you put them.",
    why: "Fewer, centralized warehouses are cheaper to run but mean longer trips to reach customers. More warehouses spread near customers cost more but get products to people faster.",
    options: [
      {
        id: "centralized",
        icon: "🏢",
        label: "Centralized",
        desc: "One large warehouse serving everyone.",
        effects: { cost: -15, speed: -10, risk: 5, satisfaction: -5, sustainability: 5 },
        tradeoff: "A single central warehouse is cheap to operate since you're not paying rent and staff in multiple locations. But every order has to travel farther to reach the customer, slowing delivery — and if that one warehouse has an issue, all fulfillment is affected."
      },
      {
        id: "regional",
        icon: "🏬",
        label: "Regional Hubs",
        desc: "A handful of warehouses spread across regions.",
        effects: { cost: 5, speed: 10, risk: 0, satisfaction: 10, sustainability: -5 },
        tradeoff: "Regional hubs balance cost and speed — you pay a bit more to run several locations, but customers in each region get faster delivery because goods don't have to travel as far."
      },
      {
        id: "distributed",
        icon: "📦",
        label: "Fully Distributed",
        desc: "Many small warehouses close to customers.",
        effects: { cost: 20, speed: 20, risk: -5, satisfaction: 15, sustainability: -10 },
        tradeoff: "A dense network of warehouses gets products to customers extremely fast and satisfaction goes way up. But running many facilities is expensive, and more buildings plus more short-haul delivery trips increase your environmental footprint."
      }
    ]
  },
  {
    id: "transport",
    title: "Choose Your Transportation Method",
    concept: "Transportation is how goods physically move between suppliers, factories, warehouses, and customers. Different methods trade off speed, cost, and environmental impact.",
    why: "This is one of the most visible supply chain decisions — it directly shapes how fast a customer's order arrives and how much fuel and emissions that journey produces.",
    options: [
      {
        id: "road",
        icon: "🚚",
        label: "Road",
        desc: "Trucks moving goods over land.",
        effects: { cost: 0, speed: 5, risk: 0, satisfaction: 0, sustainability: -5 },
        tradeoff: "Road transport is flexible and reasonably fast for shorter and medium distances, with moderate cost and moderate emissions. It's the default choice for most domestic delivery."
      },
      {
        id: "rail",
        icon: "🚆",
        label: "Rail",
        desc: "Trains moving large volumes overland.",
        effects: { cost: -5, speed: 0, risk: -5, satisfaction: 0, sustainability: 10 },
        tradeoff: "Rail is efficient for large volumes over long land distances — cheaper per unit and more fuel-efficient than trucks, and less exposed to traffic-related delays. It's slower to set up routes and less flexible door-to-door."
      },
      {
        id: "sea",
        icon: "🛳️",
        label: "Sea Freight",
        desc: "Cargo ships moving goods across oceans.",
        effects: { cost: -15, speed: -20, risk: 5, satisfaction: -10, sustainability: 5 },
        tradeoff: "Sea freight is by far the cheapest way to move large quantities internationally, and reasonably fuel-efficient per unit shipped. The catch is speed — a sea voyage can take weeks, and ships are exposed to port congestion and weather delays."
      },
      {
        id: "air",
        icon: "✈️",
        label: "Air Freight",
        desc: "Planes moving goods quickly worldwide.",
        effects: { cost: 25, speed: 25, risk: -5, satisfaction: 15, sustainability: -20 },
        tradeoff: "Air freight is the fastest option by far and very reliable on timing, which delights customers. But it's the most expensive method per unit and has the largest carbon footprint of any transport mode."
      }
    ]
  },
  {
    id: "inventory",
    title: "Choose Your Inventory Strategy",
    concept: "Inventory is the stock of materials or finished products you keep on hand before they're needed. Inventory strategy decides how much buffer stock you hold.",
    why: "Holding more inventory protects you from running out of stock (a 'stockout'), but ties up cash and warehouse space. Holding less frees up cash but raises the risk of disappointing customers when demand spikes.",
    options: [
      {
        id: "low",
        icon: "📉",
        label: "Low Inventory",
        desc: "Keep minimal stock, order frequently (just-in-time).",
        effects: { cost: -15, speed: -10, risk: 15, satisfaction: -10, sustainability: 5 },
        tradeoff: "Low inventory (a 'just-in-time' approach) frees up cash and reduces storage costs and waste. The danger is stockouts — if demand jumps unexpectedly or a shipment is late, you may have nothing to sell, hurting speed and satisfaction."
      },
      {
        id: "balanced",
        icon: "⚖️",
        label: "Balanced Inventory",
        desc: "Keep a moderate safety stock buffer.",
        effects: { cost: 0, speed: 0, risk: 0, satisfaction: 0, sustainability: 0 },
        tradeoff: "A balanced approach keeps a modest safety buffer — enough to absorb small surprises in demand or shipping delays, without tying up excessive cash in unsold stock. It's a steady, middle-of-the-road choice."
      },
      {
        id: "high",
        icon: "📈",
        label: "High Inventory",
        desc: "Stockpile large safety buffers.",
        effects: { cost: 20, speed: 15, risk: -10, satisfaction: 10, sustainability: -10 },
        tradeoff: "High inventory almost guarantees you can always fulfill orders quickly, boosting satisfaction and lowering stockout risk. But it costs a lot to store, ties up working capital, and unsold stock can go to waste — increasing environmental impact."
      }
    ]
  }
];

const METRIC_META = {
  cost: { label: "Cost", icon: "💰", invert: true, help: "How expensive your supply chain is to run. Lower is better for profit margins." },
  speed: { label: "Delivery Speed", icon: "⚡", invert: false, help: "How quickly products reach customers after ordering." },
  risk: { label: "Risk", icon: "⚠️", invert: true, help: "How exposed your supply chain is to disruptions, delays, or failures." },
  satisfaction: { label: "Customer Satisfaction", icon: "😊", invert: false, help: "How happy customers are with pricing, speed, and reliability." },
  sustainability: { label: "Sustainability", icon: "🌱", invert: false, help: "The environmental footprint of your supply chain choices." },
};

function clamp(n){ return Math.max(0, Math.min(100, n)); }

function barColor(key, value){
  const good = METRIC_META[key].invert ? value <= 40 : value >= 60;
  const bad = METRIC_META[key].invert ? value >= 70 : value <= 35;
  if (good) return "linear-gradient(90deg,#4fd1a5,#7ee0c1)";
  if (bad) return "linear-gradient(90deg,#ff7676,#ff5252)";
  return "linear-gradient(90deg,#5b8cff,#7ba6ff)";
}

/* ---------------------------------------------------------
   COMPONENT: TopBar / progress
--------------------------------------------------------- */
function TopBar({ step, totalSteps }){
  return (
    <div className="topbar">
      <div className="brand">
        <div className="brand-badge">🔗</div>
        Supply Chain Builder
      </div>
      {step >= 0 && (
        <div className="progress-track">
          {Array.from({length: totalSteps}).map((_, i) => (
            <div key={i} className={"progress-dot " + (i < step ? "done" : i === step ? "active" : "")} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   COMPONENT: Welcome screen
--------------------------------------------------------- */
function WelcomeScreen({ onStart }){
  return (
    <div className="card">
      <h1>Welcome to Supply Chain Builder 🔗</h1>
      <p>
        A <b>supply chain</b> is the full journey a product takes before it reaches a customer:
        raw materials get sourced from <b>suppliers</b>, turned into products at a <b>factory</b>,
        stored in <b>warehouses</b>, moved by some form of <b>transportation</b>, and kept ready
        as <b>inventory</b> until someone buys them.
      </p>
      <p>
        Every choice you make along this journey involves a trade-off. Cheaper often means slower.
        Faster often means more expensive or more polluting. Fewer suppliers can save money but
        increase risk. There is rarely a "perfect" answer — only the best fit for a company's
        goals.
      </p>
      <p>
        In this simulator, you'll take charge of a randomly generated company and make five key
        supply chain decisions. After each one, we'll explain exactly what changed and why —
        so by the end, you'll understand how real supply chains actually work.
      </p>
      <div className="btn-row">
        <button className="btn btn-primary" onClick={onStart}>Start Building →</button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   COMPONENT: Company reveal screen
--------------------------------------------------------- */
function CompanyReveal({ company, onNext }){
  return (
    <div className="card">
      <div className="explain-box">
        <div className="label">Your Company</div>
        <p style={{margin:0}}>Here's the business you'll be running the supply chain for. Every decision from here on will be tailored to this company's needs.</p>
      </div>
      <h1>{company.industry.icon} {company.companyName}</h1>
      <p>
        {company.companyName} operates in the <b>{company.industry.name}</b> industry, producing
        goods like <b>{company.industry.products.join(" and ")}</b>. The company currently sells
        to customers in <b>{company.countries.join(", ")}</b>.
      </p>
      <div style={{marginBottom:14}}>
        <span className="tag">📦 {company.industry.name}</span>
        <span className="tag">🌍 {company.countries.length} countries served</span>
        <span className="tag">📊 {company.demand.level} demand</span>
      </div>
      <p className="muted">
        Demand type — {company.demand.level}: {company.demand.desc}. Keep this in mind: a
        high-growth or seasonal business often needs a more flexible, faster supply chain than a
        steady, predictable one.
      </p>
      <div className="btn-row">
        <button className="btn btn-primary" onClick={onNext}>Begin Building the Supply Chain →</button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   COMPONENT: Metric bar (single)
--------------------------------------------------------- */
function MetricBar({ metricKey, value, animate }){
  const meta = METRIC_META[metricKey];
  const [display, setDisplay] = useState(animate ? 0 : value);

  useEffect(() => {
    const t = setTimeout(() => setDisplay(value), 50);
    return () => clearTimeout(t);
  }, [value]);

  return (
    <div className="metric-row">
      <div className="metric-head">
        <span>{meta.icon} {meta.label}</span>
        <b>{Math.round(value)}</b>
      </div>
      <div className="bar-track">
        <div className="bar-fill" style={{
          width: display + "%",
          background: barColor(metricKey, value)
        }} />
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   COMPONENT: Metrics sidebar
--------------------------------------------------------- */
function MetricsSidebar({ metrics }){
  return (
    <div className="card">
      <div className="sidebar-title">Live Business Metrics</div>
      {Object.keys(METRIC_META).map(key => (
        <MetricBar key={key} metricKey={key} value={metrics[key]} />
      ))}
      <p className="muted" style={{marginTop:10}}>
        For <b>Cost</b> and <b>Risk</b>, lower is generally better. For <b>Speed</b>,
        <b> Satisfaction</b>, and <b>Sustainability</b>, higher is generally better.
      </p>
    </div>
  );
}

/* ---------------------------------------------------------
   COMPONENT: Decision screen
--------------------------------------------------------- */
function DecisionScreen({ decision, onChoose, chosenOption }){
  const cols = decision.options.length === 4 ? "cols-4" : decision.options.length === 3 ? "cols-3" : "cols-2";

  return (
    <div className="card">
      <div className="explain-box">
        <div className="label">What is this?</div>
        <p style={{margin:"0 0 8px"}}>{decision.concept}</p>
        <div className="label">Why it matters</div>
        <p style={{margin:0}}>{decision.why}</p>
      </div>

      <h2>{decision.title}</h2>
      <div className={"option-grid " + cols}>
        {decision.options.map(opt => (
          <button
            key={opt.id}
            className="option-card"
            onClick={() => onChoose(decision.id, opt)}
            style={chosenOption && chosenOption.id === opt.id ? {borderColor:"var(--accent)", boxShadow:"0 0 0 3px rgba(91,140,255,0.18)"} : {}}
          >
            <span className="icon">{opt.icon}</span>
            <h4>{opt.label}</h4>
            <p>{opt.desc}</p>
          </button>
        ))}
      </div>

      {chosenOption && (
        <div className="feedback-box">
          <div className="label">Trade-off explained</div>
          <p style={{margin:0}}>{chosenOption.tradeoff}</p>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   COMPONENT: Dashboard (final results)
--------------------------------------------------------- */
function computeScore(metrics){
  const costScore = 100 - metrics.cost;
  const riskScore = 100 - metrics.risk;
  const raw = (costScore + metrics.speed + riskScore + metrics.satisfaction + metrics.sustainability) / 5;
  return Math.round(clamp(raw));
}

function getStrengthsWeaknesses(metrics){
  const scored = Object.keys(METRIC_META).map(key => {
    const meta = METRIC_META[key];
    const effective = meta.invert ? 100 - metrics[key] : metrics[key];
    return { key, label: meta.label, effective, raw: metrics[key] };
  });
  scored.sort((a,b) => b.effective - a.effective);
  const strengths = scored.slice(0, 2);
  const weaknesses = scored.slice(-2).reverse();
  return { strengths, weaknesses, scored };
}

function biggestRisk(decisions, metrics){
  const risky = [];
  if (decisions.suppliers && decisions.suppliers.id === "single") risky.push({
    text: "Relying on a single supplier means one disruption (strike, shortage, natural disaster) could halt production entirely.",
    weight: 20
  });
  if (decisions.factory && decisions.factory.id === "offshore") risky.push({
    text: "Offshore manufacturing exposes the company to long lead times, customs delays, and geopolitical/shipping disruptions.",
    weight: 20
  });
  if (decisions.inventory && decisions.inventory.id === "low") risky.push({
    text: "Low inventory levels leave little buffer — any spike in demand or delay in shipping could cause stockouts.",
    weight: 18
  });
  if (decisions.transport && decisions.transport.id === "sea") risky.push({
    text: "Sea freight's long transit times mean the company has little room to react to sudden demand changes.",
    weight: 15
  });
  if (decisions.warehouse && decisions.warehouse.id === "centralized") risky.push({
    text: "A single centralized warehouse is a single point of failure for fulfilling every order.",
    weight: 12
  });
  if (risky.length === 0){
    return "No single dominant risk stands out — the supply chain is fairly well diversified, though risk (" + Math.round(metrics.risk) + "/100) should still be monitored.";
  }
  risky.sort((a,b) => b.weight - a.weight);
  return risky[0].text;
}

function generateImprovements(decisions, metrics, scored){
  const tips = [];
  if (decisions.suppliers && decisions.suppliers.id === "single") {
    tips.push("Add a second backup supplier for critical materials to reduce concentration risk without fully committing to a multi-supplier model.");
  }
  if (decisions.factory && decisions.factory.id === "offshore") {
    tips.push("Consider a hybrid model: keep low-cost offshore manufacturing for high-volume items, but add a nearshore facility for fast-moving or urgent products.");
  }
  if (decisions.inventory && decisions.inventory.id === "low") {
    tips.push("Increase safety stock for your best-selling products specifically, rather than across the board, to cut stockout risk while limiting extra cost.");
  }
  if (decisions.transport && decisions.transport.id === "sea") {
    tips.push("Use air freight selectively for urgent or high-margin orders while keeping sea freight for bulk, non-urgent shipments — a 'blended' transport strategy.");
  }
  if (decisions.transport && decisions.transport.id === "air") {
    tips.push("Shift lower-priority shipments to rail or sea freight to cut costs and emissions, reserving air freight only for time-critical orders.");
  }
  if (decisions.warehouse && decisions.warehouse.id === "centralized") {
    tips.push("Open one or two regional satellite warehouses in your highest-demand markets to cut delivery times without the cost of a fully distributed network.");
  }
  if (metrics.sustainability < 45) {
    tips.push("Invest in more fuel-efficient transport modes (like rail) or carbon offset programs to improve sustainability without major cost increases.");
  }
  if (metrics.satisfaction < 45) {
    tips.push("Improve delivery communication and tracking for customers — this often raises satisfaction even without changing physical logistics.");
  }
  if (metrics.cost > 70) {
    tips.push("Audit each stage of the supply chain to find the single most expensive link and negotiate or renegotiate contracts there first.");
  }
  // fallback generic tips based on weakest metrics
  scored.forEach(s => {
    if (tips.length >= 6) return;
    if (s.effective < 45) {
      tips.push(`Focus improvement efforts on ${s.label.toLowerCase()}, currently your weakest area at ${Math.round(s.raw)}/100.`);
    }
  });
  if (tips.length === 0){
    tips.push("Continue monitoring demand patterns and revisit supplier contracts annually to keep costs competitive.");
    tips.push("Run periodic risk audits across suppliers, factories, and transport routes to catch new vulnerabilities early.");
    tips.push("Pilot small sustainability upgrades (like consolidating shipments) to improve environmental impact incrementally.");
  }
  // dedupe and cap at 3
  return Array.from(new Set(tips)).slice(0, 3);
}

function Dashboard({ company, decisions, metrics, onReplay }){
  const score = computeScore(metrics);
  const { strengths, weaknesses, scored } = getStrengthsWeaknesses(metrics);
  const risk = biggestRisk(decisions, metrics);
  const improvements = generateImprovements(decisions, metrics, scored);

  const scoreColor = score >= 70 ? "var(--good)" : score >= 45 ? "var(--warn)" : "var(--danger)";
  const scoreVerdict = score >= 75 ? "Excellent Supply Chain" : score >= 55 ? "Solid, Balanced Supply Chain" : score >= 35 ? "Workable but Risky Supply Chain" : "High-Risk Supply Chain";

  return (
    <div className="grid" style={{gap:22}}>
      <div className="card" style={{textAlign:"center"}}>
        <div className="muted" style={{marginBottom:4}}>Final Report for</div>
        <h1 style={{marginBottom:2}}>{company.industry.icon} {company.companyName}</h1>
        <p className="muted" style={{marginBottom:18}}>{company.industry.name} · {company.demand.level} demand · {company.countries.length} countries served</p>
        <div className="score-ring-wrap">
          <div className="score-num">{score}</div>
          <div className="score-label">Overall Supply Chain Score / 100</div>
          <div style={{marginTop:10, fontWeight:700, color: scoreColor}}>{scoreVerdict}</div>
        </div>
      </div>

      <div className="dash-grid">
        <div className="card">
          <h3>✅ Strengths</h3>
          <p className="muted" style={{marginBottom:10}}>The areas where your choices paid off the most.</p>
          <ul className="clean">
            {strengths.map(s => (
              <li key={s.key}><span className="pill-good">{s.label}</span> — scoring {Math.round(s.effective)}/100 in overall favorability.</li>
            ))}
          </ul>
        </div>

        <div className="card">
          <h3>⚠️ Weaknesses</h3>
          <p className="muted" style={{marginBottom:10}}>The areas that need the most attention.</p>
          <ul className="clean">
            {weaknesses.map(s => (
              <li key={s.key}><span className="pill-bad">{s.label}</span> — only {Math.round(s.effective)}/100 in overall favorability.</li>
            ))}
          </ul>
        </div>
      </div>

      <div className="card">
        <h3>🚨 Biggest Risk</h3>
        <p style={{margin:0}}>{risk}</p>
      </div>

      <div className="card">
        <h3>🛠️ Three Practical Improvements</h3>
        <ul className="clean">
          {improvements.map((tip, i) => <li key={i}>{tip}</li>)}
        </ul>
      </div>

      <div className="card">
        <h3>📋 Your Decisions</h3>
        <div className="choice-summary">
          {DECISIONS.map(d => decisions[d.id] && (
            <span className="tag" key={d.id}>{decisions[d.id].icon} {d.title.replace("Choose Your ","")}: {decisions[d.id].label}</span>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="sidebar-title">Final Metrics</div>
        {Object.keys(METRIC_META).map(key => (
          <MetricBar key={key} metricKey={key} value={metrics[key]} />
        ))}
      </div>

      <div className="card" style={{textAlign:"center"}}>
        <h3>Want to try a different strategy?</h3>
        <p>Every playthrough generates a brand-new company with different needs — see how your decisions should change.</p>
        <div className="btn-row" style={{justifyContent:"center"}}>
          <button className="btn btn-primary" onClick={onReplay}>🔁 Replay with a New Company</button>
        </div>
      </div>

      <div className="footer-note">Supply Chain Builder — a learning simulator. All companies and outcomes are fictional.</div>
    </div>
  );
}

/* ---------------------------------------------------------
   MAIN APP
--------------------------------------------------------- */
const BASE_METRICS = { cost: 50, speed: 50, risk: 50, satisfaction: 50, sustainability: 50 };

function App(){
  const [screen, setScreen] = useState("welcome"); // welcome | company | decision-N | dashboard
  const [company, setCompany] = useState(() => generateCompany());
  const [decisionIndex, setDecisionIndex] = useState(0);
  const [decisions, setDecisions] = useState({});
  const [metrics, setMetrics] = useState(BASE_METRICS);

  const currentDecision = DECISIONS[decisionIndex];
  const chosenForCurrent = currentDecision ? decisions[currentDecision.id] : null;

  function handleStart(){
    setScreen("company");
  }

  function handleBeginDecisions(){
    setScreen("decision");
    setDecisionIndex(0);
  }

  function handleChoose(decisionId, option){
    setDecisions(prev => ({...prev, [decisionId]: option}));
    setMetrics(prev => {
      const next = {...prev};
      Object.keys(option.effects).forEach(key => {
        next[key] = clamp(prev[key] + option.effects[key]);
      });
      return next;
    });
  }

  function handleNextDecision(){
    if (decisionIndex < DECISIONS.length - 1){
      setDecisionIndex(decisionIndex + 1);
    } else {
      setScreen("dashboard");
    }
  }

  function handleReplay(){
    setCompany(generateCompany());
    setDecisions({});
    setMetrics(BASE_METRICS);
    setDecisionIndex(0);
    setScreen("welcome");
  }

  const stepForProgress = screen === "welcome" ? -1
    : screen === "company" ? 0
    : screen === "decision" ? decisionIndex + 1
    : DECISIONS.length + 1;

  const totalSteps = DECISIONS.length + 2; // company + 5 decisions + dashboard step marker

  return (
    <div className="app">
      <TopBar step={stepForProgress} totalSteps={totalSteps} />

      {screen === "welcome" && <WelcomeScreen onStart={handleStart} />}

      {screen === "company" && (
        <CompanyReveal company={company} onNext={handleBeginDecisions} />
      )}

      {screen === "decision" && currentDecision && (
        <div className="grid two-col">
          <div>
            <DecisionScreen
              decision={currentDecision}
              onChoose={handleChoose}
              chosenOption={chosenForCurrent}
            />
            <div className="btn-row">
              <button
                className="btn btn-primary"
                disabled={!chosenForCurrent}
                style={!chosenForCurrent ? {opacity:0.4, cursor:"not-allowed"} : {}}
                onClick={handleNextDecision}
              >
                {decisionIndex < DECISIONS.length - 1 ? "Next Decision →" : "View Final Dashboard →"}
              </button>
            </div>
          </div>
          <div>
            <MetricsSidebar metrics={metrics} />
          </div>
        </div>
      )}

      {screen === "dashboard" && (
        <Dashboard company={company} decisions={decisions} metrics={metrics} onReplay={handleReplay} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
