<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing Detective</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg-0:#07130f;
  --bg-1:#0d1f19;
  --bg-2:#122b22;
  --board:#16332a;
  --cork:#2a3d2f;
  --gold:#d4af7a;
  --gold-bright:#f2d49b;
  --emerald:#1f8f5f;
  --emerald-bright:#2fd08a;
  --paper:#f3ecd8;
  --paper-dark:#e5dcc0;
  --ink:#1c1a12;
  --red-pin:#b23b3b;
  --text-soft:#cfe8dc;
  --text-dim:#8fae9e;
  --shadow:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Georgia','Times New Roman',serif;
  background:
    radial-gradient(1200px 800px at 20% -10%, rgba(47,208,138,.08), transparent 60%),
    radial-gradient(1000px 700px at 100% 100%, rgba(212,175,122,.06), transparent 60%),
    linear-gradient(180deg,var(--bg-0),var(--bg-1) 40%, var(--bg-2));
  color:var(--text-soft);
  min-height:100%;
  overflow-x:hidden;
}
#root{min-height:100vh; display:flex; flex-direction:column;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:var(--bg-1);}
::-webkit-scrollbar-thumb{background:var(--emerald); border-radius:6px;}

.app-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 32px;
  border-bottom:1px solid rgba(212,175,122,.25);
  background:linear-gradient(180deg, rgba(0,0,0,.35), transparent);
  position:sticky; top:0; z-index:50;
  backdrop-filter: blur(6px);
}
.brand{
  display:flex; align-items:center; gap:12px;
  font-family:'Trebuchet MS', sans-serif;
  letter-spacing:2px;
}
.brand .badge{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #7a5c2e 100%);
  box-shadow:0 0 18px rgba(212,175,122,.5), inset 0 0 6px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;color:#3a2a10;font-size:18px;
}
.brand h1{font-size:20px;margin:0;color:var(--gold-bright); text-shadow:0 0 12px rgba(212,175,122,.4);}
.brand span{font-size:11px;color:var(--text-dim);letter-spacing:3px;}
.progress-track{
  flex:1; max-width:360px; margin:0 30px;
  height:8px; background:rgba(255,255,255,.08); border-radius:6px; overflow:hidden;
  border:1px solid rgba(212,175,122,.2);
}
.progress-fill{
  height:100%; border-radius:6px;
  background:linear-gradient(90deg,var(--emerald),var(--emerald-bright));
  box-shadow:0 0 12px var(--emerald-bright);
  transition:width .6s ease;
}
.stage-label{font-size:12px;color:var(--text-dim); letter-spacing:1px; min-width:150px; text-align:right;}

.container{flex:1; width:100%; max-width:1180px; margin:0 auto; padding:28px 24px 70px; position:relative;}

.fade-in{animation:fadeIn .6s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
.pop-in{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both;}
@keyframes popIn{from{opacity:0; transform:scale(.85) rotate(-2deg);} to{opacity:1; transform:scale(1) rotate(var(--r,0deg));}}

/* Buttons */
.btn{
  font-family:'Trebuchet MS', sans-serif;
  cursor:pointer; border:none; border-radius:8px;
  padding:12px 26px; font-size:14px; letter-spacing:1px; font-weight:bold;
  background:linear-gradient(180deg,var(--emerald-bright),var(--emerald));
  color:#06180f; box-shadow:0 6px 18px rgba(47,208,138,.35), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(47,208,138,.5);}
.btn:active{transform:translateY(0px) scale(.98);}
.btn.secondary{
  background:linear-gradient(180deg,#3a3a3a,#242424); color:var(--gold-bright);
  border:1px solid rgba(212,175,122,.35); box-shadow:0 6px 16px rgba(0,0,0,.4);
}
.btn.gold{
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  color:#3a2a10; box-shadow:0 6px 18px rgba(212,175,122,.35), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

/* Intro screen */
.intro-wrap{ text-align:center; padding:60px 20px;}
.intro-wrap .badge-lg{
  width:110px;height:110px;border-radius:50%; margin:0 auto 22px;
  background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, #6c5023 100%);
  box-shadow:0 0 50px rgba(212,175,122,.5), inset 0 0 16px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;font-size:52px;
}
.intro-wrap h2{font-size:34px; color:var(--gold-bright); margin:0 0 10px; text-shadow:0 0 20px rgba(212,175,122,.35);}
.intro-wrap p{color:var(--text-dim); max-width:560px; margin:0 auto 30px; line-height:1.6; font-size:15px;}

/* Corkboard / Folder for case assignment */
.folder{
  max-width:640px; margin:0 auto; position:relative;
  background:var(--paper);
  border-radius:4px 14px 14px 14px;
  box-shadow:var(--shadow), inset 0 0 40px rgba(0,0,0,.05);
  padding:34px 34px 28px;
  color:var(--ink);
  transform:rotate(-1deg);
}
.folder:before{
  content:'CONFIDENTIAL';
  position:absolute; top:-16px; left:24px;
  background:var(--red-pin); color:#fff; font-size:11px; letter-spacing:2px;
  padding:4px 12px; border-radius:2px; font-family:'Trebuchet MS',sans-serif;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}
.folder-tab{
  position:absolute; top:-22px; right:40px;
  background:var(--paper-dark); padding:6px 18px; border-radius:6px 6px 0 0;
  font-size:12px; letter-spacing:1px; color:#6b5b34; font-family:'Trebuchet MS',sans-serif;
  box-shadow:0 -2px 6px rgba(0,0,0,.15);
}
.stamp{
  position:absolute; bottom:18px; right:24px;
  border:3px solid var(--red-pin); color:var(--red-pin);
  padding:6px 14px; border-radius:6px; font-weight:bold; letter-spacing:2px;
  transform:rotate(-8deg); opacity:.75; font-family:'Courier New',monospace; font-size:13px;
}
.case-title{font-size:24px; margin:6px 0 4px; font-family:'Trebuchet MS',sans-serif; color:#2a2210;}
.case-sub{color:#6b5b34; font-size:13px; margin-bottom:18px; letter-spacing:.5px;}
.case-brief{line-height:1.7; font-size:14.5px;}
.case-brief b{color:#1c1a12;}
.folder-meta{
  display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; font-size:12.5px;
}
.folder-meta span{
  background:rgba(0,0,0,.06); padding:4px 10px; border-radius:20px; color:#4a3d1e;
}

/* Investigation board layout */
.board{
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 2px, transparent 2px, transparent 4px),
    var(--cork);
  border-radius:16px; padding:30px; position:relative;
  box-shadow:var(--shadow), inset 0 0 60px rgba(0,0,0,.5);
  border:10px solid #3d2c1a;
  background-image:
    radial-gradient(rgba(0,0,0,.15) 1px, transparent 1px);
  background-size:14px 14px;
}
.board-title{
  font-family:'Trebuchet MS',sans-serif; color:var(--gold-bright); text-align:center;
  letter-spacing:3px; font-size:14px; margin-bottom:22px; text-transform:uppercase;
  text-shadow:0 0 10px rgba(212,175,122,.4);
}
.board-grid{display:grid; grid-template-columns:1fr; gap:22px;}
@media(min-width:900px){ .board-grid{grid-template-columns: 1.1fr 1.4fr;} }

.data-card{
  background:var(--paper); color:var(--ink); border-radius:6px; padding:16px 18px;
  box-shadow:0 8px 18px rgba(0,0,0,.4); position:relative; font-size:13.5px; line-height:1.55;
}
.pin{
  position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff8a80, var(--red-pin));
  box-shadow:0 3px 6px rgba(0,0,0,.5);
}
.data-card h3{
  margin:2px 0 10px; font-family:'Trebuchet MS',sans-serif; font-size:14px; color:#3a2a10;
  border-bottom:1px dashed #b7a879; padding-bottom:6px; letter-spacing:.5px;
}
.metric-row{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dotted #d8cca4;}
.metric-row:last-child{border-bottom:none;}
.metric-row b{color:#2a2210;}
.tag-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.tag-list span{background:#e7dcbb; padding:3px 9px; border-radius:20px; font-size:11.5px; color:#5a4a24;}

.chart-bar-wrap{margin-top:8px;}
.chart-bar-label{display:flex; justify-content:space-between; font-size:11.5px; color:#5a4a24; margin-bottom:3px;}
.chart-bar-track{height:9px; background:#e2d6ae; border-radius:6px; overflow:hidden; margin-bottom:9px;}
.chart-bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,#1f8f5f,#2fd08a); transition:width 1s ease;}

.comments-list{list-style:none; margin:0; padding:0;}
.comments-list li{
  background:#fffdf3; border:1px solid #e2d6ae; border-radius:6px; padding:8px 10px; margin-bottom:8px;
  font-style:italic; color:#3a2f18; position:relative; font-size:13px;
}
.comments-list li:before{content:'“'; font-size:22px; color:#c9b77b; position:absolute; left:-2px; top:-6px;}

.social-stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
.social-chip{
  flex:1; min-width:90px; background:#fffdf3; border:1px solid #e2d6ae; border-radius:8px;
  padding:8px; text-align:center;
}
.social-chip .num{font-size:16px; font-weight:bold; color:#1f8f5f; font-family:'Trebuchet MS',sans-serif;}
.social-chip .lbl{font-size:10.5px; color:#7a6a42; letter-spacing:.5px;}

/* sticky notes / evidence board */
.evidence-panel{display:flex; flex-direction:column; gap:16px;}
.evidence-title{
  font-family:'Trebuchet MS',sans-serif; color:var(--text-dim); font-size:12px; letter-spacing:2px; text-transform:uppercase;
  text-align:center;
}
.evidence-zone{
  min-height:230px; border:2px dashed rgba(212,175,122,.3); border-radius:12px; padding:16px;
  position:relative; background:rgba(0,0,0,.15);
  display:flex; flex-wrap:wrap; gap:14px; align-content:flex-start;
}
.evidence-zone.drag-over{border-color:var(--emerald-bright); background:rgba(47,208,138,.08);}
.sticky{
  width:150px; min-height:100px; background:#f5e97c; color:#3a3418; padding:12px 12px 16px;
  border-radius:2px; box-shadow:0 8px 14px rgba(0,0,0,.4); font-size:12.5px; line-height:1.4;
  cursor:grab; transition:transform .2s ease, box-shadow .2s ease;
  transform:rotate(var(--rot,-2deg));
  position:relative; user-select:none;
}
.sticky:nth-child(2n){background:#ffd8a8;}
.sticky:nth-child(3n){background:#c9f2d8;}
.sticky:hover{transform:rotate(0deg) scale(1.05) translateY(-4px); box-shadow:0 14px 22px rgba(0,0,0,.5); z-index:5;}
.sticky.dragging{opacity:.4;}
.sticky.placed{cursor:default;}
.sticky .pin-mini{
  position:absolute; top:-7px; left:50%; transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%; background:radial-gradient(circle at 35% 30%,#8fd,#3a3);
  box-shadow:0 2px 5px rgba(0,0,0,.5);
}
.sticky-label{font-size:10px; text-transform:uppercase; letter-spacing:1px; opacity:.6; margin-bottom:4px; display:block;}

.slots-zone{display:flex; flex-direction:column; gap:10px;}
.slot{
  min-height:60px; border:2px dashed rgba(255,255,255,.15); border-radius:10px;
  display:flex; align-items:center; padding:8px 12px; gap:10px; background:rgba(255,255,255,.03);
  transition:border-color .2s, background .2s;
}
.slot.drag-over{border-color:var(--gold-bright); background:rgba(212,175,122,.1);}
.slot .slot-hint{color:var(--text-dim); font-size:12px; font-style:italic;}
.slot.filled{border-style:solid; border-color:var(--emerald-bright);}

/* magnifier hint */
.hint-btn{
  display:inline-flex; align-items:center; gap:6px; background:none; border:1px solid rgba(212,175,122,.4);
  color:var(--gold-bright); padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer;
  font-family:'Trebuchet MS',sans-serif; transition:background .2s;
}
.hint-btn:hover{background:rgba(212,175,122,.12);}

/* Solve screen */
.solve-wrap{max-width:760px; margin:0 auto;}
.suspects-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin:22px 0;}
.suspect-card{
  background:var(--board); border:2px solid rgba(212,175,122,.15); border-radius:12px; padding:16px;
  cursor:pointer; transition:all .2s ease; position:relative; overflow:hidden;
}
.suspect-card:hover{border-color:var(--emerald-bright); transform:translateY(-3px); box-shadow:0 10px 22px rgba(47,208,138,.2);}
.suspect-card.selected{border-color:var(--gold-bright); box-shadow:0 0 0 3px rgba(212,175,122,.25), 0 10px 24px rgba(212,175,122,.25);}
.suspect-card h4{margin:0 0 6px; color:var(--gold-bright); font-family:'Trebuchet MS',sans-serif; font-size:14.5px;}
.suspect-card p{margin:0; font-size:12.5px; color:var(--text-dim); line-height:1.5;}
.suspect-check{position:absolute; top:10px; right:10px; font-size:18px; opacity:0; transition:opacity .2s;}
.suspect-card.selected .suspect-check{opacity:1;}

/* Case closed */
.closed-wrap{text-align:center; padding:50px 20px; position:relative;}
.stamp-lg{
  display:inline-block; border:6px solid var(--red-pin); color:var(--red-pin); font-family:'Courier New',monospace;
  font-weight:bold; font-size:44px; letter-spacing:6px; padding:14px 36px; border-radius:10px;
  transform:rotate(-6deg); animation:stampIn .5s cubic-bezier(.2,.7,.3,1.4) both; margin-bottom:20px;
  box-shadow:0 0 40px rgba(178,59,59,.4);
}
@keyframes stampIn{from{transform:scale(2.4) rotate(-6deg); opacity:0;} to{transform:scale(1) rotate(-6deg); opacity:1;}}
.confetti{
  position:absolute; width:8px;height:14px; top:-20px; opacity:.9; animation:fall linear forwards;
}
@keyframes fall{to{transform:translateY(620px) rotate(360deg); opacity:0;}}
.verdict-msg{font-size:18px; color:var(--gold-bright); margin-bottom:8px;}
.verdict-sub{color:var(--text-dim); font-size:14px; margin-bottom:26px;}

/* Learning report */
.report-wrap{max-width:760px; margin:0 auto;}
.report-card{
  background:var(--paper); color:var(--ink); border-radius:10px; padding:26px 28px; box-shadow:var(--shadow); margin-bottom:18px;
}
.report-card h3{margin-top:0; font-family:'Trebuchet MS',sans-serif; color:#2a2210; border-bottom:2px solid #d8cca4; padding-bottom:8px;}
.improve-list{margin:0; padding-left:20px; line-height:1.8;}
.score-ring-wrap{display:flex; align-items:center; gap:20px; justify-content:center; margin-bottom:10px;}
.badge-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
.badge-chip{
  background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#3a2a10; padding:6px 14px; border-radius:20px;
  font-size:12px; font-weight:bold; font-family:'Trebuchet MS',sans-serif; box-shadow:0 4px 10px rgba(212,175,122,.4);
}

.footer-actions{display:flex; justify-content:center; gap:16px; margin-top:26px; flex-wrap:wrap;}

.magnifier-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center;
  z-index:200; animation:fadeIn .25s ease both;
}
.magnifier-card{
  background:var(--paper); color:var(--ink); max-width:480px; width:90%; padding:26px; border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.6); position:relative;
}
.magnifier-card h3{margin-top:0; font-family:'Trebuchet MS',sans-serif;}
.magnifier-close{
  position:absolute; top:10px; right:14px; background:none; border:none; font-size:20px; cursor:pointer; color:#6b5b34;
}

.feedback-banner{
  padding:12px 18px; border-radius:8px; margin-bottom:16px; font-size:13.5px; text-align:center;
  font-family:'Trebuchet MS',sans-serif;
}
.feedback-banner.correct{background:rgba(47,208,138,.15); border:1px solid var(--emerald-bright); color:var(--emerald-bright);}
.feedback-banner.wrong{background:rgba(178,59,59,.15); border:1px solid var(--red-pin); color:#ff9b9b;}

.small-note{font-size:11.5px; color:var(--text-dim); text-align:center; margin-top:10px;}

@media (max-width:600px){
  .app-header{padding:14px 16px;}
  .progress-track{display:none;}
  .folder{padding:22px 18px;}
  .board{padding:18px;}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================ DATA ============================ */
const CASES = [
{
  company:"Lumen & Loom",
  industry:"Home Decor / E-commerce",
  objective:"Drive holiday-season sales of a new smart-lighting collection.",
  audience:"Urban millennials, 25-40, interested in home aesthetics & tech gadgets.",
  channels:["Instagram Ads","Email Marketing","Influencer Partnerships","Google Shopping"],
  budget:[{label:"Instagram Ads",pct:40},{label:"Influencers",pct:30},{label:"Email",pct:15},{label:"Google Shopping",pct:15}],
  metrics:{reach:"2.4M",ctr:"0.4%",engagement:"1.2%",conversions:"310",sales:"$18,900"},
  comments:[
    "Saw this everywhere on Instagram but the site was confusing to browse.",
    "Loved the influencer video but couldn't find the exact product shown.",
    "Ad looked great, checkout page felt like a totally different brand."
  ],
  social:{likes:"41K",shares:"2.1K",comments:"860",sentiment:"Mixed"},
  mistake:"Massive top-of-funnel spend on awareness (ads + influencers) with almost no investment in landing page optimization or checkout experience, causing high traffic but a broken conversion path.",
  clues:[
    "CTR is unusually low for the reach achieved, suggesting the ad creative isn't matching what users expect on click-through.",
    "Customer comments repeatedly mention confusion between the ad/influencer content and the actual website experience.",
    "Budget allocation shows 70% spent on visibility (ads+influencers) versus almost nothing on conversion infrastructure."
  ],
  explanation:"Lumen & Loom generated huge reach and buzz through influencers and paid social, but neglected the on-site experience. Shoppers arrived excited, hit a mismatched, cluttered landing page and inconsistent product presentation, and abandoned before purchasing. The mistake was an imbalanced funnel: heavy top-of-funnel investment with a leaky, unoptimized bottom-of-funnel experience.",
  improvements:[
    "Create dedicated landing pages that visually match each influencer's content and ad creative.",
    "Simplify checkout flow and reduce steps to purchase.",
    "Reallocate 15-20% of ad budget toward CRO (conversion rate optimization) and page-speed improvements.",
    "A/B test product pages against the exact imagery used in ads."
  ]
},
{
  company:"PulseFit Nutrition",
  industry:"Health & Wellness / Supplements",
  objective:"Launch a new protein powder line and capture new-customer subscriptions.",
  audience:"Gym-goers and fitness enthusiasts, 18-34.",
  channels:["TikTok Ads","YouTube Pre-roll","Affiliate Marketing","SMS"],
  budget:[{label:"TikTok Ads",pct:45},{label:"YouTube",pct:20},{label:"Affiliates",pct:20},{label:"SMS",pct:15}],
  metrics:{reach:"5.1M",ctr:"2.9%",engagement:"6.4%",conversions:"1,240",sales:"$61,200"},
  comments:[
    "Ordered because of a TikTok creator, but flavor tasted nothing like the video hyped it up to be.",
    "Got 5 texts in two days after signing up, felt spammy and I unsubscribed.",
    "Great first purchase experience, but I won't do the subscription again."
  ],
  social:{likes:"210K",shares:"18K",comments:"4.3K",sentiment:"Positive then declining"},
  mistake:"Aggressive SMS retargeting immediately after purchase overwhelmed new customers, causing high unsubscribe and churn rates that erased the gains from a genuinely strong acquisition campaign.",
  clues:[
    "Engagement and reach numbers are excellent, showing the creative and channel mix worked for acquisition.",
    "Comments highlight a common complaint: excessive SMS messages shortly after purchase.",
    "Subscription cancellations spiked specifically in the first two weeks after sign-up, not later."
  ],
  explanation:"The acquisition strategy (TikTok + affiliates) was highly effective — reach, CTR and engagement were strong. However, the post-purchase SMS cadence was too aggressive, sending multiple messages per day. This created a poor first impression that drove early churn, undermining the subscription model's long-term value despite excellent top-of-funnel performance.",
  improvements:[
    "Redesign the SMS welcome sequence with a maximum of 1-2 messages per week initially.",
    "Add explicit subscription value messaging (savings, exclusivity) before asking for more engagement.",
    "Segment SMS frequency based on customer preference collected at signup.",
    "Introduce a satisfaction check-in before the first re-order reminder."
  ]
},
{
  company:"Northside Roasters",
  industry:"Food & Beverage / Coffee",
  objective:"Increase foot traffic to 3 new café locations.",
  audience:"Local professionals and students, 20-45, within 5 miles of each location.",
  channels:["Local SEO","Facebook Ads","Radio","Loyalty App Push Notifications"],
  budget:[{label:"Radio",pct:35},{label:"Facebook Ads",pct:30},{label:"Local SEO",pct:20},{label:"App Push",pct:15}],
  metrics:{reach:"890K",ctr:"1.1%",engagement:"2.0%",conversions:"420 store visits",sales:"$14,300"},
  comments:[
    "Heard the radio ad three times a day but the address they gave was for the wrong branch.",
    "Google Maps still shows old hours for the new location.",
    "App notification told me about a deal that had already ended when I got there."
  ],
  social:{likes:"3.2K",shares:"210",comments:"140",sentiment:"Neutral"},
  mistake:"Inconsistent and outdated location/business information across offline (radio) and online (Google, app) channels created confusion that suppressed store visits despite decent awareness.",
  clues:[
    "Store-visit conversions are low relative to reach and ad spend on radio, a channel usually strong for local awareness.",
    "Multiple comments cite incorrect addresses, hours, or expired offers across different channels.",

/* ============================ HELPERS ============================ */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickRandomCase(){
  return CASES[Math.floor(Math.random()*CASES.length)];
}
function buildSuspects(correctCase, allCases){
  // "suspects" = mistake options; one correct, three distractors from other cases
  const others = shuffle(allCases.filter(c=>c.company!==correctCase.company)).slice(0,3);
  const options = shuffle([
    {id:'correct', text: correctCase.mistake, correct:true},
    ...others.map((c,i)=>({id:'d'+i, text:c.mistake, correct:false}))
  ]);
  return options;
}

const STAGES = ["Case Assignment","Investigation Board","Evidence Analysis","Solve the Case","Case Closed","Learning Report"];

/* ============================ APP STATE ============================ */
const root = document.getElementById('root');

const state = {
  stage:0,
  currentCase:null,
  suspects:[],
  selectedSuspectId:null,
  submitted:false,
  isCorrect:false,
  placedEvidence:{}, // slotId -> stickyId
  evidenceItems:[],
  score:0,
  attempts:0,
  magnifier:null,
};

function render(){
  root.innerHTML = '';
  root.appendChild(Header());
  const container = document.createElement('div');
  container.className='container';
  container.appendChild(StageView());
  root.appendChild(container);
  if(state.magnifier){
    root.appendChild(MagnifierOverlay());
  }
}

/* ============================ HEADER ============================ */
function Header(){
  const header = document.createElement('div');
  header.className='app-header';
  const pct = ((state.stage)/(STAGES.length-1))*100;
  header.innerHTML = `
    <div class="brand">
      <div class="badge">🕵️</div>
      <div>
        <h1>Marketing Detective</h1>
        <span>CASE FILE DIVISION</span>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="stage-label">${state.stage+1}. ${STAGES[state.stage]}</div>
  `;
  return header;
}

/* ============================ STAGE ROUTER ============================ */
function StageView(){
  switch(state.stage){
    case 0: return IntroOrAssignment();
    case 1: return InvestigationBoard();
    case 2: return EvidenceAnalysis();
    case 3: return SolveCase();
    case 4: return CaseClosed();
    case 5: return LearningReport();
    default: return document.createElement('div');
  }
}

/* ============================ STAGE 0: INTRO / ASSIGNMENT ============================ */
function IntroOrAssignment(){
  const wrap = document.createElement('div');
  if(!state.currentCase){
    wrap.className='intro-wrap fade-in';
    wrap.innerHTML = `
      <div class="badge-lg">🔍</div>
      <h2>The Case Files Await</h2>
      <p>Somewhere in this stack of confidential folders lies a marketing campaign gone wrong. Sales dipped. Sentiment soured. Someone made a mistake — and it's your job to find it, using nothing but data, comments, and a sharp eye for clues.</p>
      <button class="btn gold" id="assign-btn">Open a New Case File</button>
    `;
    setTimeout(()=>{
      const b = document.getElementById('assign-btn');
      if(b) b.onclick = ()=>{
        state.currentCase = pickRandomCase();
        state.suspects = buildSuspects(state.currentCase, CASES);
        state.selectedSuspectId=null;
        state.submitted=false;
        state.isCorrect=false;
        state.placedEvidence={};
        const c = state.currentCase;
        state.evidenceItems = shuffle([
          {id:'clue0', label:'Clue', text:c.clues[0]},
          {id:'clue1', label:'Clue', text:c.clues[1]},
          {id:'clue2', label:'Clue', text:c.clues[2]},
        ]);
        render();
      };
    },0);
    return wrap;
  }
  const c = state.currentCase;
  wrap.className='fade-in';
  wrap.innerHTML = `
    <div class="folder">
      <div class="folder-tab">Case File</div>
      <div class="case-title">${c.company}</div>
      <div class="case-sub">${c.industry} &middot; Marketing Investigation</div>
      <div class="case-brief">
        <b>Objective:</b> ${c.objective}<br><br>
        <b>Target Audience:</b> ${c.audience}<br><br>
        A campaign was launched. Numbers moved. Somewhere in the data, comments, and channel spend lies <b>one critical mistake</b>. Your task: study the evidence, then identify what went wrong.
      </div>
      <div class="folder-meta">
        <span>📊 Reach: ${c.metrics.reach}</span>
        <span>💰 Sales: ${c.metrics.sales}</span>
        <span>📁 Status: OPEN</span>
      </div>
      <div class="stamp">OPEN CASE</div>
    </div>
    <div style="text-align:center; margin-top:30px;">
      <button class="btn" id="board-btn">Proceed to Investigation Board →</button>
    </div>
  `;
  setTimeout(()=>{
    const b = document.getElementById('board-btn');
    if(b) b.onclick = ()=>{ state.stage=1; render(); };
  },0);
  return wrap;
}

/* ============================ STAGE 1: INVESTIGATION BOARD ============================ */
function InvestigationBoard(){
  const c = state.currentCase;
  const wrap = document.createElement('div');
  wrap.className='fade-in';

  const maxBudget = Math.max(...c.budget.map(b=>b.pct));

  wrap.innerHTML = `
    <div class="board">
      <div class="board-title">📌 Investigation Board — ${c.company}</div>
      <div class="board-grid">
        <div style="display:flex; flex-direction:column; gap:22px;">
          <div class="data-card pop-in" style="--r:-1deg;"><div class="pin"></div>
            <h3>Channel Budget Allocation</h3>
            <div class="chart-bar-wrap">
              ${c.budget.map(b=>`
                <div class="chart-bar-label"><span>${b.label}</span><span>${b.pct}%</span></div>
                <div class="chart-bar-track"><div class="chart-bar-fill" style="width:0%" data-target="${b.pct}"></div></div>
              `).join('')}
            </div>
          </div>
          <div class="data-card pop-in" style="--r:1deg;"><div class="pin"></div>
            <h3>Campaign Metrics</h3>
            <div class="metric-row"><span>Reach</span><b>${c.metrics.reach}</b></div>
            <div class="metric-row"><span>CTR</span><b>${c.metrics.ctr}</b></div>
            <div class="metric-row"><span>Engagement</span><b>${c.metrics.engagement}</b></div>
            <div class="metric-row"><span>Conversions</span><b>${c.metrics.conversions}</b></div>
            <div class="metric-row"><span>Sales</span><b>${c.metrics.sales}</b></div>
          </div>
          <div class="data-card pop-in" style="--r:-2deg;"><div class="pin"></div>
            <h3>Channels Used</h3>
            <div class="tag-list">${c.channels.map(ch=>`<span>${ch}</span>`).join('')}</div>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:22px;">
          <div class="data-card pop-in" style="--r:1.5deg;"><div class="pin"></div>
            <h3>Customer Comments</h3>
            <ul class="comments-list">${c.comments.map(cm=>`<li>${cm}</li>`).join('')}</ul>
          </div>
          <div class="data-card pop-in" style="--r:-1.5deg;"><div class="pin"></div>
            <h3>Social Media Performance</h3>
            <div class="social-stats">
              <div class="social-chip"><div class="num">${c.social.likes}</div><div class="lbl">LIKES</div></div>
              <div class="social-chip"><div class="num">${c.social.shares}</div><div class="lbl">SHARES</div></div>
              <div class="social-chip"><div class="num">${c.social.comments}</div><div class="lbl">COMMENTS</div></div>
            </div>
            <div style="margin-top:10px; font-size:12.5px; color:#5a4a24;"><b>Sentiment:</b> ${c.social.sentiment}</div>
          </div>
        </div>
      </div>
    </div>
    <div style="text-align:center; margin-top:26px;">
      <button class="btn secondary" id="back-btn">← Back</button>
      <button class="btn" id="next-btn" style="margin-left:14px;">Gather Evidence →</button>
    </div>
  `;
  setTimeout(()=>{
    document.querySelectorAll('.chart-bar-fill').forEach((el,i)=>{
      setTimeout(()=>{ el.style.width = el.dataset.target+'%'; }, 150+i*100);
    });
    const back = document.getElementById('back-btn');
    if(back) back.onclick=()=>{ state.stage=0; render(); };
    const next = document.getElementById('next-btn');
    if(next) next.onclick=()=>{ state.stage=2; render(); };
  },0);
  return wrap;
}

/* ============================ STAGE 2: EVIDENCE ANALYSIS (drag & drop) ============================ */
function EvidenceAnalysis(){
  const c = state.currentCase;
  const wrap = document.createElement('div');
  wrap.className='fade-in';

  const allPlaced = Object.keys(state.placedEvidence).length === 3;

  wrap.innerHTML = `
    <div class="board">
      <div class="board-title">🧩 Pin the Supporting Clues to the Case Thread</div>
      <p style="text-align:center; color:var(--text-dim); font-size:13px; max-width:560px; margin:0 auto 20px;">
        Drag each sticky note clue into a thread slot below. Once all three are pinned, the pattern behind the mistake should become clear.
      </p>
      <div class="board-grid">
        <div class="evidence-panel">
          <div class="evidence-title">Loose Evidence</div>
          <div class="evidence-zone" id="pool-zone"></div>
        </div>
        <div class="evidence-panel">
          <div class="evidence-title">Case Thread</div>
          <div class="slots-zone" id="slots-zone">
            <div class="slot" data-slot="0"><span class="slot-hint">Slot 1 — drop a clue here</span></div>
            <div class="slot" data-slot="1"><span class="slot-hint">Slot 2 — drop a clue here</span></div>
            <div class="slot" data-slot="2"><span class="slot-hint">Slot 3 — drop a clue here</span></div>
          </div>
        </div>
      </div>
    </div>
    <div style="text-align:center; margin-top:26px;">
      <button class="btn secondary" id="back-btn">← Back</button>
      <button class="btn" id="next-btn" ${allPlaced?'':'disabled'} style="margin-left:14px;">Proceed to Solve the Case →</button>
    </div>
    ${allPlaced? '' : '<div class="small-note">Pin all three clues to continue.</div>'}
  `;

  setTimeout(()=>{
    const poolZone = document.getElementById('pool-zone');
    const slots = document.querySelectorAll('.slot');

    const placedIds = new Set(Object.values(state.placedEvidence));
    const unplaced = state.evidenceItems.filter(ev=>!placedIds.has(ev.id));

    unplaced.forEach((ev,i)=>{
      const sticky = document.createElement('div');
      sticky.className='sticky pop-in';
      sticky.style.setProperty('--rot',(i%2===0?-3:3)+'deg');
      sticky.setAttribute('draggable','true');
      sticky.dataset.id = ev.id;
      sticky.innerHTML = `<div class="pin-mini"></div><span class="sticky-label">${ev.label}</span>${ev.text}`;
      sticky.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('text/plain', ev.id);
        sticky.classList.add('dragging');
      });
      sticky.addEventListener('dragend', ()=> sticky.classList.remove('dragging'));
      poolZone.appendChild(sticky);
    });

    // render placed evidence inside slots
    Object.entries(state.placedEvidence).forEach(([slotIdx, evId])=>{
      const slotEl = document.querySelector(`.slot[data-slot="${slotIdx}"]`);
      const ev = state.evidenceItems.find(e=>e.id===evId);
      if(slotEl && ev){
        slotEl.classList.add('filled');
        slotEl.innerHTML = '';
        const sticky = document.createElement('div');
        sticky.className='sticky placed';
        sticky.style.setProperty('--rot','0deg');
        sticky.innerHTML = `<div class="pin-mini"></div><span class="sticky-label">${ev.label}</span>${ev.text}`;
        slotEl.appendChild(sticky);
      }
    });

    poolZone.addEventListener('dragover', e=>{ e.preventDefault(); poolZone.classList.add('drag-over'); });
    poolZone.addEventListener('dragleave', ()=> poolZone.classList.remove('drag-over'));
    poolZone.addEventListener('drop', e=>{
      e.preventDefault();
      poolZone.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      // remove from any slot if it was placed
      for(const k of Object.keys(state.placedEvidence)){
        if(state.placedEvidence[k]===id) delete state.placedEvidence[k];
      }
      render();
    });

    slots.forEach(slotEl=>{
      slotEl.addEventListener('dragover', e=>{ e.preventDefault(); slotEl.classList.add('drag-over'); });
      slotEl.addEventListener('dragleave', ()=> slotEl.classList.remove('drag-over'));
      slotEl.addEventListener('drop', e=>{
        e.preventDefault();
        slotEl.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        const slotIdx = slotEl.dataset.slot;
        // clear this id from any other slot first
        for(const k of Object.keys(state.placedEvidence)){
          if(state.placedEvidence[k]===id) delete state.placedEvidence[k];
        }
        state.placedEvidence[slotIdx] = id;
        render();
      });
    });

    const back = document.getElementById('back-btn');
    if(back) back.onclick=()=>{ state.stage=1; render(); };
    const next = document.getElementById('next-btn');
    if(next && !next.disabled) next.onclick=()=>{ state.stage=3; render(); };
  },0);

  return wrap;
}

/* ============================ STAGE 3: SOLVE THE CASE ============================ */
function SolveCase(){
  const c = state.currentCase;
  const wrap = document.createElement('div');
  wrap.className='fade-in solve-wrap';

  wrap.innerHTML = `
    <div style="text-align:center;">
      <h2 style="color:var(--gold-bright); font-family:'Trebuchet MS',sans-serif; margin-bottom:6px;">Name the Marketing Mistake</h2>
      <p style="color:var(--text-dim); font-size:13.5px; max-width:520px; margin:0 auto;">Based on all the evidence gathered, which of these is the <b>primary</b> marketing mistake behind ${c.company}'s campaign performance?</p>
    </div>
    <div class="suspects-grid" id="suspects-grid"></div>
    ${state.submitted ? `<div class="feedback-banner ${state.isCorrect?'correct':'wrong'}">
        ${state.isCorrect ? '✅ Correct deduction, detective. The evidence lines up.' : '❌ Not quite. Re-examine the evidence — the real mistake is still out there.'}
      </div>` : ''}
    <div style="text-align:center; margin-top:10px;">
      <button class="btn secondary" id="back-btn">← Back to Evidence</button>
      ${!state.submitted ? `<button class="btn" id="submit-btn" style="margin-left:14px;" disabled>Submit Deduction</button>`
        : (state.isCorrect ? `<button class="btn gold" id="close-btn" style="margin-left:14px;">Close the Case →</button>`
        : `<button class="btn" id="retry-btn" style="margin-left:14px;">Try Again</button>`)}
    </div>
  `;

  setTimeout(()=>{
    const grid = document.getElementById('suspects-grid');
    state.suspects.forEach((s,i)=>{
      const card = document.createElement('div');
      card.className='suspect-card pop-in' + (state.selectedSuspectId===s.id ? ' selected':'');
      card.style.setProperty('--r', ((i%2===0?-1:1))+'deg');
      card.innerHTML = `<div class="suspect-check">🟢</div><h4>Theory ${String.fromCharCode(65+i)}</h4><p>${s.text}</p>`;
      if(!state.submitted){
        card.onclick = ()=>{ state.selectedSuspectId = s.id; render(); };
      }
      grid.appendChild(card);
    });

    const back = document.getElementById('back-btn');
    if(back) back.onclick=()=>{ state.stage=2; render(); };

    const submitBtn = document.getElementById('submit-btn');
    if(submitBtn){
      submitBtn.disabled = !state.selectedSuspectId;
      submitBtn.onclick = ()=>{
        state.attempts++;
        state.submitted = true;
        const chosen = state.suspects.find(s=>s.id===state.selectedSuspectId);
        state.isCorrect = !!(chosen && chosen.correct);
        if(state.isCorrect) state.score = Math.max(0, 100 - (state.attempts-1)*20);
        render();
      };
    }
    const closeBtn = document.getElementById('close-btn');
    if(closeBtn) closeBtn.onclick = ()=>{ state.stage=4; render(); };
    const retryBtn = document.getElementById('retry-btn');
    if(retryBtn) retryBtn.onclick = ()=>{ state.submitted=false; state.selectedSuspectId=null; render(); };
  },0);

  return wrap;
}

/* ============================ STAGE 4: CASE CLOSED ============================ */
function CaseClosed(){
  const c = state.currentCase;
  const wrap = document.createElement('div');
  wrap.className='closed-wrap fade-in';

  const confettiColors = ['#2fd08a','#d4af7a','#f2d49b','#1f8f5f'];
  let confettiHtml = '';
  for(let i=0;i<28;i++){
    const left = Math.random()*100;
    const delay = Math.random()*0.6;
    const dur = 2 + Math.random()*1.8;
    const color = confettiColors[i%confettiColors.length];
    confettiHtml += `<div class="confetti" style="left:${left}%; background:${color}; animation-duration:${dur}s; animation-delay:${delay}s;"></div>`;
  }

  wrap.innerHTML = `
    ${confettiHtml}
    <div class="stamp-lg">CLOSED</div>
    <div class="verdict-msg">Case #${(c.company.length*7)%900+100} — ${c.company} — Solved</div>
    <div class="verdict-sub">Detective score: <b style="color:var(--emerald-bright)">${state.score}</b> / 100 &middot; Attempts: ${state.attempts}</div>
    <button class="btn gold" id="report-btn">View Learning Report →</button>
  `;
  setTimeout(()=>{
    const btn = document.getElementById('report-btn');
    if(btn) btn.onclick = ()=>{ state.stage=5; render(); };
  },0);
  return wrap;
}

/* ============================ STAGE 5: LEARNING REPORT ============================ */
function LearningReport(){
  const c = state.currentCase;
  const wrap = document.createElement('div');
  wrap.className='report-wrap fade-in';

  wrap.innerHTML = `
    <div class="report-card pop-in">
      <h3>🕵️ Final Verdict</h3>
      <p style="line-height:1.7;">${c.explanation}</p>
    </div>
    <div class="report-card pop-in" style="--r:.5deg;">
      <h3>🛠️ Suggested Improvements</h3>
      <ul class="improve-list">${c.improvements.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>
    <div class="report-card pop-in" style="--r:-.5deg;">
      <h3>🏅 Detective Rank</h3>
      <div class="score-ring-wrap">
        <div>
          <p style="margin:4px 0;">Score: <b>${state.score}</b>/100</p>
          <p style="margin:4px 0;">Attempts on this case: <b>${state.attempts}</b></p>
        </div>
      </div>
      <div class="badge-row">
        ${state.score>=80 ? '<span class="badge-chip">🥇 Master Detective</span>' : ''}
        ${state.score>=50 && state.score<80 ? '<span class="badge-chip">🥈 Sharp Investigator</span>' : ''}
        ${state.score<50 ? '<span class="badge-chip">🥉 Rookie Sleuth</span>' : ''}
        <span class="badge-chip">📁 Case Closed: ${c.company}</span>
      </div>
    </div>
    <div class="footer-actions">
      <button class="btn secondary" id="review-btn">Review Board Again</button>
      <button class="btn gold" id="newcase-btn">Start a New Case →</button>
    </div>
  `;
  setTimeout(()=>{
    const rev = document.getElementById('review-btn');
    if(rev) rev.onclick = ()=>{ state.stage=1; render(); };
    const nc = document.getElementById('newcase-btn');
    if(nc) nc.onclick = ()=>{
      state.currentCase=null; state.stage=0; state.selectedSuspectId=null; state.submitted=false;
      state.isCorrect=false; state.placedEvidence={}; state.attempts=0; state.score=0;
      render();
    };
  },0);
  return wrap;
}

/* ============================ MAGNIFIER (unused placeholder for extensibility) ============================ */
function MagnifierOverlay(){
  const overlay = document.createElement('div');
  overlay.className='magnifier-overlay';
  overlay.innerHTML = `<div class="magnifier-card"><button class="magnifier-close">×</button><h3>Note</h3><p>${state.magnifier||''}</p></div>`;
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.magnifier=null; render(); } };
  setTimeout(()=>{
    const closeBtn = overlay.querySelector('.magnifier-close');
    if(closeBtn) closeBtn.onclick = ()=>{ state.magnifier=null; render(); };
  },0);
  return overlay;
}

/* ============================ INIT ============================ */
render();
</script>
</body>
</html>
